<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Thai Mate — 교민 실시간 1:1 매칭 & 주문</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --ink:#191b1d; --sub:#8a9099; --line:#ececec;
    --pri:#ff7a33; --pri-soft:#fff1e8; --blue:#2f6df0; --green:#15a05a; --gold:#f5a524; --red:#ef4444;
    --shadow:0 1px 2px rgba(20,24,30,.05),0 8px 22px rgba(20,24,30,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#d7dae0;font-family:"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  .device{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
  .top-row{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.3px}
  .brand .logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--pri),#ffa869);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900}
  .ttl{font-weight:700;font-size:13.5px;color:var(--sub)}
  .spacer{flex:1}
  .icon-btn{width:36px;height:36px;border:none;background:transparent;border-radius:10px;font-size:18px;display:grid;place-items:center;cursor:pointer}
  .lang{display:flex;background:#f0f1f4;border-radius:10px;padding:3px}
  .lang button{border:none;background:transparent;font-size:11.5px;font-weight:700;color:var(--sub);padding:5px 8px;border-radius:8px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--pri);box-shadow:var(--shadow)}
  .cities{display:flex;gap:7px;padding:0 14px 11px;overflow-x:auto;scrollbar-width:none}
  .cities::-webkit-scrollbar{display:none}
  .city{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .city.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg{display:flex;background:#f0f1f4;border-radius:12px;padding:4px;margin:0 0 14px}
  .seg button{flex:1;border:none;background:transparent;font-weight:800;font-size:13px;color:var(--sub);padding:9px 0;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .page{flex:1;overflow-y:auto;padding:14px 14px 96px}
  .page::-webkit-scrollbar{display:none}
  .vbanner{display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,#fff1e8,#fff8f3);border:1px solid #ffd9c2;border-radius:13px;padding:11px 13px;margin-bottom:14px}
  .vbanner .em{font-size:20px}
  .vbanner b{font-size:13px;letter-spacing:-.2px}
  .vbanner p{margin:2px 0 0;font-size:11.5px;color:#b9620f;line-height:1.35}
  .livebar{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#15a05a;margin:0 2px 12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#15a05a;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,160,90,.45)}70%{box-shadow:0 0 0 9px rgba(21,160,90,0)}100%{box-shadow:0 0 0 0 rgba(21,160,90,0)}}
  .list{display:flex;flex-direction:column;gap:11px}
  /* C2C listing card */
  .card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow);cursor:pointer}
  .thumb{width:84px;height:84px;flex:0 0 84px;border-radius:12px;background:linear-gradient(135deg,#eef1f6,#e2e7f0);display:grid;place-items:center;font-size:36px;position:relative;overflow:hidden}
  .thumb.want{background:linear-gradient(135deg,#fff1e8,#ffe2cf)}
  .thumb.give{background:linear-gradient(135deg,#e7f7ee,#d2f0e0)}
  .badge{position:absolute;left:5px;top:5px;font-size:9.5px;font-weight:800;padding:3px 6px;border-radius:6px;color:#fff}
  .badge.sale{background:var(--green)} .badge.resv{background:var(--gold)} .badge.done{background:#9aa0a8} .badge.match{background:var(--pri)}
  .cbody{flex:1;min-width:0}
  .ctitle{font-size:14.5px;font-weight:700;line-height:1.32;letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cmeta{font-size:11.5px;color:var(--sub);margin-top:4px}
  .price{font-size:16px;font-weight:900;margin-top:6px}
  .actions{display:flex;align-items:center;gap:8px;margin-top:9px}
  .abtn{border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12px;font-weight:700;color:#4b5563;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .abtn.chat{background:var(--pri);border-color:var(--pri);color:#fff}
  .live-mini{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .abtn.like.on{color:var(--red);border-color:#f6c9c4;background:#fdeceb}
  /* listing detail */
  .ldphoto{height:210px;display:grid;place-items:center;font-size:80px;position:relative;background:linear-gradient(135deg,#eef1f6,#e2e7f0);border-radius:16px;margin-bottom:6px}
  .ldphoto.want{background:linear-gradient(135deg,#fff1e8,#ffe2cf)} .ldphoto.give{background:linear-gradient(135deg,#e7f7ee,#d2f0e0)}
  .ldphoto .badge{left:12px;top:12px;font-size:11px;padding:4px 9px}
  .ldseller{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .ldseller .avatar{width:44px;height:44px;flex:0 0 44px}
  .ldseller b{font-size:14px} .ldseller .lds{font-size:11.5px;color:var(--sub);margin-top:2px}
  .ldtitle{font-size:18px;font-weight:800;letter-spacing:-.3px;margin:15px 2px 6px;line-height:1.35}
  .ldmeta{font-size:12px;color:var(--sub);margin:0 2px}
  .ldprice{font-size:22px;font-weight:900;margin:11px 2px}
  .lddesc{font-size:14px;color:#374151;line-height:1.65;margin:0 2px;white-space:pre-wrap}
  .ldbar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;background:#fff;border-top:1px solid var(--line);padding:12px 2px;margin:18px -14px 0}
  .ldbar .ldlike{width:50px;height:50px;flex:0 0 50px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:22px;cursor:pointer;margin-left:14px}
  .ldbar .ldlike.on{border-color:#f6c9c4;background:#fdeceb}
  .ldbar .ldchat{flex:1;border:none;background:var(--pri);color:#fff;font-weight:800;font-size:15px;padding:15px;border-radius:13px;cursor:pointer;margin-right:14px}
  /* shop (광고) */
  .scard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow);cursor:pointer;margin-bottom:11px}
  .sthumb{width:72px;height:72px;flex:0 0 72px;border-radius:13px;background:linear-gradient(135deg,#fff1e8,#ffe2cf);display:grid;place-items:center;font-size:34px;position:relative}
  .adb{position:absolute;left:4px;top:4px;font-size:9px;font-weight:800;background:#191b1d;color:#ffd27a;padding:2px 6px;border-radius:6px}
  .sbody{flex:1;min-width:0}
  .snm{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .smeta{font-size:12px;color:#4b5563;margin-top:3px}
  .sgray{color:var(--sub)}
  .spills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pill{font-size:11px;font-weight:700;color:#4b5563;background:#f1f3f6;border-radius:8px;padding:5px 9px}
  .sgo{align-self:center;color:#c2c7d0;font-size:20px}
  .orderbtn{font-size:12px;font-weight:800;color:#fff;background:var(--pri);border-radius:9px;padding:8px 12px}
  /* store detail */
  .detail-head{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
  .back{border:none;background:transparent;font-size:24px;cursor:pointer;padding:0 4px;line-height:1}
  .detail-head .hn{font-size:15px;font-weight:800}
  .detail-head .hs{font-size:11.5px;color:var(--sub);margin-top:2px}
  .storebanner{height:120px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#fff1e8,#ffe0cb)}
  .msec{font-size:13px;font-weight:800;color:var(--sub);margin:12px 2px 8px}
  .mrow2{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #f4f4f2}
  .memo{width:52px;height:52px;flex:0 0 52px;border-radius:11px;background:#f4f5f7;display:grid;place-items:center;font-size:26px}
  .mmid{flex:1;min-width:0}
  .mnm{font-size:14px;font-weight:600}
  .mpr{font-size:14px;font-weight:900;margin-top:3px}
  .stepper{display:flex;align-items:center;gap:9px}
  .stbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:17px;font-weight:800;color:var(--ink);cursor:pointer;display:grid;place-items:center}
  .stbtn.add{background:var(--pri);border-color:var(--pri);color:#fff}
  .qn{min-width:18px;text-align:center;font-weight:800;font-size:14px}
  .cartbar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;background:#191b1d;color:#fff;border-radius:14px;padding:11px 12px 11px 16px;margin:14px 2px 0;box-shadow:0 8px 22px rgba(0,0,0,.25)}
  .cc{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--pri);font-size:12px;font-weight:800;padding:0 6px}
  .ct{font-size:14px;font-weight:800}
  .orderfab{margin-left:auto;border:none;background:var(--pri);color:#fff;font-weight:800;font-size:14px;padding:11px 18px;border-radius:11px;cursor:pointer}
  .bigbtn{width:100%;border:none;background:var(--pri);color:#fff;font-weight:800;font-size:15px;padding:14px;border-radius:13px;cursor:pointer;margin-top:14px}
  /* chat */
  .chatrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);cursor:pointer}
  .avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#eef1f6}
  .chatrow .ci{flex:1;min-width:0}
  .chatrow .cn{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
  .chip{font-size:10px;font-weight:800;color:var(--pri);background:var(--pri-soft);border-radius:6px;padding:2px 6px}
  .chatrow .lastmsg{font-size:12.5px;color:#6b7280;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chatrow .cr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .chatrow .tm{font-size:11px;color:var(--sub)}
  .unread{min-width:19px;height:19px;border-radius:999px;background:var(--pri);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
  .secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#15a05a;background:#eaf7ef;padding:8px;margin:0}
  .deal{display:flex;gap:10px;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}
  .deal .dn{font-size:12.5px;font-weight:700}
  .deal .dp{font-size:13px;font-weight:900}
  .msgs{padding:14px 12px;display:flex;flex-direction:column;gap:9px;background:#f6f6f4;min-height:42vh}
  .bub{max-width:76%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.4}
  .bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .bub.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
  .inbar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}
  .inbar input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 14px;font-size:13px;outline:none}
  .inbar .send{border:none;background:var(--pri);color:#fff;border-radius:999px;width:42px;font-size:18px;cursor:pointer}
  /* info */
  .ipost{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:11px}
  .imeta{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .itag{font-size:10.5px;font-weight:800;color:var(--blue);background:#eaf2ff;border-radius:7px;padding:3px 8px}
  .otag{font-size:10.5px;font-weight:800;color:#fff;background:var(--red);border-radius:7px;padding:3px 8px}
  .idot{font-size:11.5px;color:var(--sub);margin-left:auto}
  .ititle{margin:0;font-size:15px;font-weight:700;line-height:1.35;letter-spacing:-.2px}
  .iexc{margin:5px 0 0;font-size:12.5px;color:#4b5563;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ireact{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
  .rb{border:1px solid var(--line);background:#fff;border-radius:9px;font-size:11.5px;font-weight:700;color:#5b6472;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .rb b{font-weight:800}
  .rb.on{color:var(--pri);border-color:var(--pri);background:var(--pri-soft)}
  .rb.ask{color:var(--pri);border-color:#ffd2b8;background:var(--pri-soft)}
  .iviews{font-size:11px;color:var(--sub);margin-left:auto}
  /* clubs */
  .club{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;margin-bottom:12px}
  .club .banner{height:92px;display:flex;align-items:flex-end;padding:12px 14px;color:#fff;font-weight:800;font-size:17px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .club .cbody2{padding:12px 14px}
  .club .desc{font-size:12.5px;color:#4b5563;line-height:1.45}
  .club .cfoot{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:12px;color:var(--sub)}
  .flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--gold);background:#fff7e8;border:1px solid #ffe6b3;border-radius:999px;padding:4px 10px}
  .join{margin-left:auto;border:none;background:var(--pri);color:#fff;font-weight:800;font-size:12.5px;padding:8px 16px;border-radius:10px;cursor:pointer}
  /* me */
  .profile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);text-align:center;margin-bottom:14px}
  .pav{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--pri),#ffa869);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 10px}
  .pname{font-size:17px;font-weight:800}
  .trust{display:inline-flex;align-items:center;gap:6px;margin-top:7px;background:#eaf7ef;color:var(--green);font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px}
  .mannerbar{height:7px;border-radius:999px;background:#eef1f6;margin:14px 0 4px;overflow:hidden}
  .mannerbar i{display:block;height:100%;width:88%;background:linear-gradient(90deg,#ffd27a,var(--green))}
  .menu{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-top:14px}
  .mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer}
  .mrow:last-child{border-bottom:none}
  .mrow .ar{margin-left:auto;color:#c2c7d0}
  .mrow .em{font-size:18px;width:24px;text-align:center}
  .multilang-note{font-size:10.5px;color:var(--sub);background:#eef0f3;border-radius:7px;padding:2px 7px;margin-left:6px}
  .sech{font-size:15px;margin:2px 2px 11px;letter-spacing:-.3px;font-weight:800}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:46px 0}
  /* fab + nav + toast */
  .fab{position:absolute;right:16px;bottom:84px;z-index:25;height:50px;border-radius:999px;background:var(--pri);color:#fff;border:none;font-size:14px;font-weight:800;box-shadow:0 8px 22px rgba(255,122,51,.45);cursor:pointer;display:flex;align-items:center;gap:7px;padding:0 18px}
  .nav{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 2px 10px}
  .nav button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;color:#9aa1ad;font-size:10px;font-weight:700;position:relative}
  .nav button .ic{font-size:20px;line-height:1}
  .nav button.on{color:var(--pri)}
  .nav .ndot{position:absolute;top:2px;right:50%;transform:translateX(14px);min-width:15px;height:15px;border-radius:999px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#191b1d;color:#fff;font-size:12.5px;font-weight:600;padding:11px 16px;border-radius:11px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:88%;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.3)}
  .toast.show{opacity:1}
  /* gate */
  .gate{display:none;flex-direction:column;min-height:100vh;background:linear-gradient(165deg,#ffffff,#fff6f0 52%,#ffe7d6);padding:0 22px;position:relative}
  .glang{position:absolute;top:14px;right:16px}
  .ghero{text-align:center;padding:62px 0 6px}
  .glogo{width:74px;height:74px;border-radius:23px;background:linear-gradient(135deg,var(--pri),#ffa869);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900;margin:0 auto 16px;box-shadow:0 14px 30px rgba(255,122,51,.42)}
  .gname{font-size:27px;font-weight:900;letter-spacing:-.6px}
  .gname span{color:var(--pri)}
  .gtag{font-size:13.5px;color:var(--sub);margin-top:9px;line-height:1.55;font-weight:600}
  .gmid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:13px;padding:8px 0}
  .loccard{position:relative;overflow:hidden;border-radius:18px;padding:15px 16px;min-height:122px;display:flex;flex-direction:column;justify-content:flex-end;background:#cfd8e0 url('assets/thai-temple.jpg') center/cover no-repeat;box-shadow:0 12px 28px rgba(150,80,30,.3);cursor:pointer}
  .loccard::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.16) 42%,rgba(0,0,0,.62) 100%)}
  .loccard>*{position:relative;z-index:1}
  .loccard .lh{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.55)}
  .loccard .lv{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
  .loccard .lname{font-size:21px;font-weight:900;letter-spacing:-.3px;flex:1;line-height:1.2;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .loccard .lname.empty{color:#fff;font-size:19px}
  .loccard .lsub{font-size:11.5px;font-weight:600;margin-top:3px;color:rgba(255,255,255,.92);text-shadow:0 1px 5px rgba(0,0,0,.5)}
  .loccard .lchev{font-size:24px;color:#fff;font-weight:800;text-shadow:0 1px 5px rgba(0,0,0,.5)}
  .locnote{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#b9620f;font-weight:700;background:#fff1e8;border-radius:11px;padding:11px;text-align:center;line-height:1.4}
  .gbtns{padding:8px 0 28px;display:flex;flex-direction:column;gap:9px;max-width:300px;margin:0 auto;width:100%}
  .gbtn{border:none;border-radius:13px;font-size:15px;font-weight:800;padding:13px;cursor:pointer}
  .gbtn.primary{background:var(--pri);color:#fff;box-shadow:0 8px 20px rgba(255,122,51,.4)}
  .gbtn.line{background:#fff;color:var(--ink);border:1.5px solid #e0e2e6}
  .gbtn.ghost{background:transparent;color:var(--sub);font-weight:700;font-size:13.5px;padding:6px;text-decoration:underline}
  /* auth forms */
  .gform{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center;padding:0 0 26px}
  .gfield label{font-size:12px;font-weight:800;color:var(--sub);margin:0 2px 6px;display:block}

<script>

function hoodByDbId(n){ return hoodsFlat().find(h=>h.dbId===n)||null; }
function hoodDbId(localId){ const h=hoodsFlat().find(x=>x.id===localId); return h?h.dbId:null; }
function relTime(ts){ try{ const m=Math.floor((Date.now()-new Date(ts).getTime())/60000); if(m<1)return {ko:'방금 전',en:'just now',th:'เมื่อกี้'}; if(m<60)return {ko:m+'분 전',en:m+'m',th:m+' นาที'}; const h=Math.floor(m/60); if(h<24)return {ko:h+'시간 전',en:h+'h',th:h+' ชม.'}; return {ko:Math.floor(h/24)+'일 전',en:Math.floor(h/24)+'d',th:Math.floor(h/24)+' วัน'}; }catch(e){return {ko:'',en:'',th:''};} }
function dbToListing(row){
  const h=hoodByDbId(row.hood_id), give=row.kind==='give', buy=row.kind==='buy';
  const st=buy?'match':(row.status==='reserved'?'resv':(row.status==='done'?'done':'sale'));
  return { id:row.id, author_id:row.author_id, kind:row.kind, st, emo:give?'🎁':(buy?'🔎':'🆕'), city:h?h.region:'all', hoodId:h?h.id:null, like:0, chats:0, live:false,
    t:row.title||'', pr:give?{ko:'무료나눔',en:'Free',th:'แจกฟรี'}:(row.price_text||{ko:'가격문의',en:'Ask',th:'สอบถาม'}), loc:h?tx(h):'', desc:row.body||'', ago:relTime(row.created_at) };
}
async function loadListings(){
  try{ const {data,error}=await sb.from('listings').select('*').in('kind',['sell','buy','give']).order('created_at',{ascending:false}).limit(100);

}
const SEMO={restaurant:'🍲',cafe:'🥐',mart:'🛒',beauty:'💇',service:'🧹',etc:'🏪'};

  const h=hoodByDbId(row.hood_id);
  const menu=(row.menu_items||[]).slice().sort((a,b)=>a.price-b.price).map(m=>({id:m.id,emo:m.emoji||'🍽️',pr:m.price,nm:m.name||''}));

    city:h?h.region:'all', hoodId:h?h.id:null, rating:row.rating||5.0, reviews:row.reviews_count||0,
    service:!!row.is_service, nm:row.name||'', product:(row.category==='mart'),
    min: menu.length?('฿'+menu[0].pr):null, menu: menu.length?menu:undefined,

}
function dbToPost(row){
  const h=hoodByDbId(row.hood_id);
  return { id:row.id, official:!!row.is_official, cat:(parseInt(row.category)||0), city:h?h.region:'all',

}
async function loadPosts(){
  try{ const {data,error}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(100);

}
function dbToJob(row){
  const h=hoodByDbId(row.hood_id);

}
/* ===================== 영속화: 반응 · 거래상태 · 주문 ===================== */
const isUuid=v=>typeof v==='string'&&v.length>=32;
async function loadMyReactions(){
  if(!uid) return;
  try{ const {data}=await sb.from('post_reactions').select('post_id,type').eq('user_id',uid);
    (data||[]).forEach(r=>{ const p=info.find(x=>x.id===r.post_id); if(p){ if(r.type==='helpful')p.rHelp=true; else if(r.type==='save')p.rSave=true; } });
    if(screen==='app'&&tab==='community') render();

/* ===================== 1:1 채팅 (DB + Realtime) ===================== */
let chatSub=null;
function chatToLocal(row, nameMap){
  const iAmBuyer=(row.buyer_id===uid), otherId=iAmBuyer?row.seller_id:row.buyer_id, li=row.listings||{};
  const ms=(row.messages||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const lastM=ms.length?ms[ms.length-1]:null;
  return { id:row.id, buyerId:row.buyer_id, sellerId:row.seller_id, listingId:row.listing_id,
    av:'🧑', who:(nameMap&&nameMap[otherId])||(lang==='ko'?'사용자':'User'),
    item:li.title||(lang==='ko'?'대화':'Chat'), price:li.price_text||'', city:'all',
    unread: iAmBuyer?(row.buyer_unread||0):(row.seller_unread||0),
    last: lastM?lastM.body:'', tm: relTime(row.last_message_at||row.created_at),
    msgs: ms.map(m=>({me:m.sender_id===uid, tx:m.body, id:m.id})) };
}
async function loadChats(){
  if(!uid) return;
  try{
    const {data,error}=await sb.from('chats').select('*, listings(title,price_text), messages(id,body,created_at,sender_id)').or(`buyer_id.eq.${uid},seller_id.eq.${uid}`).order('last_message_at',{ascending:false});
    if(error||!Array.isArray(data)) return;
    const otherIds=[...new Set(data.map(r=>r.buyer_id===uid?r.seller_id:r.buyer_id).filter(Boolean))];
    let nameMap={};
    if(otherIds.length){ const {data:ps}=await sb.from('profiles').select('id,username,nickname').in('id',otherIds); (ps||[]).forEach(p=>nameMap[p.id]=p.nickname||p.username); }
    chats.length=0; data.forEach(r=>chats.push(chatToLocal(r,nameMap)));
    if(screen==='app'&&tab==='chat'&&chatOpen===null) render();
  }catch(e){}
}
async function openOrCreateChat(listing){
  if(!listing||!listing.id||!listing.author_id){ toast(L().reply_demo); return; }   // 데모(비DB) 매물
  if(listing.author_id===uid){ toast(lang==='ko'?'내 글에는 채팅할 수 없어요':'Cannot chat on your own post'); return; }
  try{
    let {data:ex}=await sb.from('chats').select('*').eq('listing_id',listing.id).eq('buyer_id',uid).maybeSingle();
    let row=ex;
    if(!row){ const ins=await sb.from('chats').insert({listing_id:listing.id, buyer_id:uid, seller_id:listing.author_id, last_message_at:new Date().toISOString()}).select().single(); if(ins.error){toast(ins.error.message);return;} row=ins.data; }
    await loadChats(); listingOpen=null; tab='chat';
    const idx=chats.findIndex(c=>c.id===row.id);
    if(idx>=0) openChat(idx); else render();
  }catch(e){ toast(String(e.message||e)); }
}
async function openChat(idx){
  chatOpen=idx; const c=chats[idx]; render();
  if(!c) return;
  await loadMessages(c.id); subscribeChat(c.id);
  try{ const fld=(c.sellerId===uid)?'seller_unread':'buyer_unread'; await sb.from('chats').update({[fld]:0}).eq('id',c.id); c.unread=0; }catch(e){}
}
async function loadMessages(chatId){
  try{ const {data}=await sb.from('messages').select('*').eq('chat_id',chatId).order('created_at',{ascending:true});
    const c=chats.find(x=>x.id===chatId); if(c&&Array.isArray(data)){ c.msgs=data.map(m=>({me:m.sender_id===uid,tx:m.body,id:m.id})); if(chatOpen!==null&&chats[chatOpen]&&chats[chatOpen].id===chatId){render();page.scrollTo(0,9999);} }
  }catch(e){}
}
function subscribeChat(chatId){
  try{ if(chatSub){ sb.removeChannel(chatSub); chatSub=null; } }catch(e){}
  try{ chatSub=sb.channel('chat-'+chatId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'chat_id=eq.'+chatId}, payload=>{
    const m=payload.new; if(m.sender_id===uid) return;
    const c=chats.find(x=>x.id===chatId); if(!c) return; c.msgs=c.msgs||[];
    if(c.msgs.some(x=>x.id===m.id)) return;
    c.msgs.push({me:false,tx:m.body,id:m.id});
    if(chatOpen!==null&&chats[chatOpen]&&chats[chatOpen].id===chatId){ render(); page.scrollTo(0,9999); }
  }).subscribe(); }catch(e){}
}
async function sendMessage(text){
  if(chatOpen===null) return; const c=chats[chatOpen]; if(!c||!c.id) return;
  const tmpId='tmp'+Date.now(); c.msgs=c.msgs||[]; c.msgs.push({me:true,tx:text,id:tmpId}); render(); page.scrollTo(0,9999);
  try{
    const ins=await sb.from('messages').insert({chat_id:c.id, sender_id:uid, body:text}).select().single();
    if(ins.error){ toast(ins.error.message); return; }
    const mm=c.msgs.find(x=>x.id===tmpId); if(mm) mm.id=ins.data.id;
    const otherFld=(c.sellerId===uid)?'buyer_unread':'seller_unread';
    try{ const {data:cur}=await sb.from('chats').select(otherFld).eq('id',c.id).single(); const nu=((cur&&cur[otherFld])||0)+1; await sb.from('chats').update({last_message_at:new Date().toISOString(),[otherFld]:nu}).eq('id',c.id); }catch(e){}
  }catch(e){ toast(String(e.message||e)); }
}
async function applySession(session){
  if(!session||!session.user){authed=false;uid=null;return;}
  const u=session.user; authed=true; uid=u.id;
  acctId=(u.email||'').split('@')[0];
  emailVerified=false;
  try{ if(session.access_token) sb.realtime.setAuth(session.access_token); }catch(e){}
  screen='app';
  try{ await sb.from('profiles').upsert({id:u.id, username:acctId},{onConflict:'id'}); }catch(e){}
  try{ const {data:p}=await sb.from('profiles').select('email_verified').eq('id',u.id).single();
       emailVerified=!!(p && p.email_verified); }catch(e){}
  try{ const {data:adm}=await sb.rpc('is_admin'); isAdmin=!!adm; if(screen==='app'&&tab==='me') render(); }catch(e){}
  loadChats();
}
async function doAuth(mode){
  const id=((document.getElementById('auId')||{}).value||'').trim();
  const pw=((document.getElementById('auPw')||{}).value||'');
  if(!id||!pw){toast(lang==='ko'?'아이디와 비밀번호를 입력하세요':'Enter ID & password');return;}
  if(mode==='signup' && pw!==((document.getElementById('auPw2')||{}).value||'')){toast(lang==='ko'?'비밀번호가 일치하지 않아요':'Passwords do not match');return;}
  const email=uname2email(id);
  let res = (mode==='signup') ? await sb.auth.signUp({email,password:pw}) : await sb.auth.signInWithPassword({email,password:pw});
  if(res.error){
    const m=(res.error.message||'').toLowerCase();
    if(mode==='signup' && (m.includes('already')||m.includes('registered')||m.includes('exists'))){
      toast(L().e_id_taken); gateMode='login'; render(); return;   // 중복 아이디 → 로그인 화면
    }
    toast(res.error.message); return;
  }
  // Confirm email ON일 때 중복 아이디는 에러 없이 "빈 identities" 유저를 돌려줌 → 가입 가장(假裝) 차단
  if(mode==='signup'){
    const u0=res.data&&res.data.user;
    if(u0 && Array.isArray(u0.identities) && u0.identities.length===0){
      toast(L().e_id_taken); gateMode='login'; render(); return;
    }
  }
  let sess=res.data&&res.data.session; if(!sess){sess=(await sb.auth.getSession()).data.session;}
  if(!sess){ toast(mode==='signup'?L().e_id_taken:(res.error&&res.error.message)||''); if(mode==='signup'){gateMode='login';render();} return; }
  await applySession(sess); acctId=id;
  const realEmail=(mode==='signup')?((document.getElementById('auEmail')||{}).value||'').trim():'';
  gateMode='home'; screen='app'; render();
  if(mode==='signup' && realEmail){
    verifyOpen=true; verifySent=false; vEmailVal=realEmail; render();
    reqEmailCode(realEmail); return;
  }
  toast(mode==='signup'?L().e_signup_ok:L().e_login_ok);
}

function hoodById(id){for(const r in REGIONS){const h=REGIONS[r].hoods.find(x=>x.id===id);if(h)return h;}return null;}
function distanceKm(a,b){
  if(!a||!b||a.lat==null||b.lat==null) return 9999;
  const R=6371,toR=d=>d*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function nearestHood(lat,lng){let best=null,bd=1e9;for(const r in REGIONS)for(const h of REGIONS[r].hoods){const d=distanceKm({lat,lng},h);if(d<bd){bd=d;best={region:r,h};}}return best;}
function itemDist(it){const ih=it.hoodId?hoodById(it.hoodId):null;return (hood&&ih)?distanceKm(hood,ih):9999;}
function inRange(it){
  if(city==='all'||it.city==='all') return true;
  if(it.city!==city) return false;
  if(!hood) return true;
  const ih=it.hoodId?hoodById(it.hoodId):null;
  if(!ih) return true;
  if(radiusKm===0) return ih.id===hood.id;
  return distanceKm(hood,ih)<=radiusKm;
}

function searchAll(q){
  q=(q||"").trim().toLowerCase(); if(!q)return [];
  const r=[], hit=s=>tx(s).toLowerCase().includes(q);

  stores.forEach(x=>{if(hit(x.nm))r.push({tag:L().nav_shop,emo:x.emo,t:tx(x.nm),sub:L().shop_cats[x.cat],go:'shop'});});
  jobs.forEach(x=>{if(hit(x.t))r.push({tag:x.kind==='hire'?L().seg_hire:L().seg_seek,emo:x.emo,t:tx(x.t),sub:tx(x.loc),go:'jobs'});});

}

function renderNav(){
  const items=[["shop","🏪","nav_shop"],["market","🛍️","nav_market"],["jobs","💼","nav_jobs"],["chat","💬","nav_chat"],["community","🏘️","nav_community"],["me","👤","nav_me"]];

      <span class="ic">${ic}</span><span>${L()[key]}</span>
      ${k==='chat'&&totalUnread?`<span class="ndot">${totalUnread}</span>`:''}
    </button>`).join('');
}
function renderFab(){
  const hide=(tab==='chat')||(tab==='me')||(tab==='shop'&&storeOpen)||(tab==='community'&&commSeg==='clubs')||(tab==='market'&&listingOpen);
  if(hide){fab.style.display='none';return;}
  fab.style.display='flex';
  let lbl=L().fab_market;
  if(tab==='shop')lbl=L().fab_shop; else if(tab==='jobs')lbl=L().fab_jobs; else if(tab==='community')lbl=L().fab_info;
  fab.innerHTML=`✏️ ${lbl}`;
}
function render(){
  if(screen==='gate'){
    gateEl.style.display='flex'; topEl.style.display='none'; page.style.display='none'; fab.style.display='none'; navEl.style.display='none';
    renderGate(); renderPicker(); renderPay(); renderGmGate(); renderVerify(); return;
  }
  gateEl.style.display='none'; topEl.style.display=''; page.style.display=''; navEl.style.display='';
  renderTop(); renderNav(); renderFab();
  if(tab==='shop') storeOpen?viewStore():viewShop();
  else if(tab==='market') listingOpen?viewListingDetail():viewMarket();
  else if(tab==='jobs') viewJobs();
  else if(tab==='chat') chatOpen!==null?viewChatDetail():viewChatList();
  else if(tab==='community') viewCommunity();
  else if(tab==='me') viewMe();
  renderPicker(); renderPay(); renderGmGate(); renderVerify(); renderWrite(); renderReport(); renderReview(); renderFsView();
}

/* ===================== events ===================== */
document.addEventListener('click',e=>{
  const lg=e.target.closest('[data-l]'); if(lg){lang=lg.dataset.l;render();return;}
  /* gate */
  const gt=e.target.closest('[data-gate]'); if(gt){const m=gt.dataset.gate;
    if(m==='browse'){authed=false;emailVerified=false;screen='app';}else{gateMode=m;}
    render();return;}
  const gmo=e.target.closest('[data-gmode]'); if(gmo){gateMode=gmo.dataset.gmode;render();return;}
  const aus=e.target.closest('[data-ausubmit]'); if(aus){doAuth(aus.dataset.ausubmit);return;}
  if(e.target.closest('[data-logout]')){doLogout();return;}
  if(e.target.closest('[data-dologin]')){screen='gate';gateMode='home';render();return;}
  const meRow=e.target.closest('[data-me]'); if(meRow){ const i=+meRow.dataset.me;
    if(i===0){ tab='chat'; chatOpen=null; render(); }                       // 판매·구매내역 → 거래 대화
    else if(i===1){ if(!canAct())return; writeType=6; writeOpen=true; render(); }  // 내 가게 관리·등록
    else if(i===4){ openInquiry(); }                                        // 관리자에게 문의
    else { toast(L().soon); }                                               // 관심목록·받은 매너후기
    return; }
  /* email verification */
  if(e.target.closest('[data-verify]')){verifyOpen=true;verifySent=false;render();return;}
  const vau=e.target.closest('[data-vauth]'); if(vau){verifyOpen=false;verifySent=false;screen='gate';gateMode=vau.dataset.vauth;render();return;}
  if(e.target.closest('#vsend')){ const em=((document.getElementById('vEmail')||{}).value||'').trim(); if(!em){toast(L().v_email);return;} reqEmailCode(em); return;}
  if(e.target.closest('#vresend')){ reqEmailCode(vEmailVal); return;}
  if(e.target.closest('#vconfirm')){ const cd=((document.getElementById('vCode')||{}).value||'').trim(); if(!cd){toast(L().v_code_label);return;} confirmEmailCode(cd); return;}
  if(e.target.closest('#vclose')||e.target.closest('#vclose2')){verifyOpen=false;verifySent=false;render();return;}
  if(e.target.closest('[data-vfromgm]')){gmGateOpen=false;verifyOpen=true;verifySent=false;render();return;}
  if(e.target.closest('[data-gmenter]')){const h=(document.getElementById('gmHandi')||{}).value||'';window.open(GM_URL+'/?sso=thaimate&handi='+encodeURIComponent(h),'_blank');return;}
  /* 알림센터 · 검색 */
  if(e.target.closest('[data-noti]')){NOTI.forEach(n=>n.unread=false);fsView='noti';render();return;}
  if(e.target.closest('[data-search]')){fsView='search';searchQ='';render();return;}
  if(e.target.closest('[data-fsback]')){fsView=null;render();return;}
  const ng=e.target.closest('[data-notigo]'); if(ng){fsView=null;tab=ng.dataset.notigo;chatOpen=null;storeOpen=null;golfOpen=false;render();page.scrollTo(0,0);return;}
  const sg=e.target.closest('[data-srchgo]'); if(sg){fsView=null;tab=sg.dataset.srchgo;chatOpen=null;storeOpen=null;golfOpen=false;render();page.scrollTo(0,0);return;}
  /* 글쓰기 */
  const wt=e.target.closest('[data-wtype]'); if(wt){writeType=+wt.dataset.wtype;renderWrite();return;}
  if(e.target.closest('[data-wclose]')){writeOpen=false;render();return;}
  if(e.target.closest('[data-wsubmit]')){
    const subj=((document.getElementById('wSubject')||{}).value||'').trim();
    const price=((document.getElementById('wPrice')||{}).value||'').trim();
    const desc=((document.getElementById('wDesc')||{}).value||'').trim();
    const rc=(city!=='all'?city:'bkk'), hid=hood?hood.id:null, locStr=hood?tx(hood):(L()['city_'+rc]||''), ago={ko:'방금 전',en:'just now',th:'เมื่อกี้'};
    if(writeType<=2){const kind=['sell','buy','give'][writeType];
      sb.from('listings').insert({author_id:uid, kind, title:subj||L().w_subject, price_text:(kind==='give'?'무료':(price||null)), body:desc||null, hood_id:hoodDbId(hid), status:'selling'}).then(({error})=>{ if(error){toast(error.message);} else {loadListings();} });
      tab='market'; mseg=kind; listingOpen=null;
    }else if(writeType===6){
      sb.from('stores').insert({owner_id:uid, name:subj||L().w_store, category:'etc', hood_id:hoodDbId(hid), is_service:true}).then(({error})=>{ if(error){toast(error.message);} else {loadStores();} });
      tab='shop'; shopCat=0;
    }else if(writeType===3||writeType===4){const kind=writeType===3?'hire':'seek';
      sb.from('listings').insert({author_id:uid, kind, title:subj||L().w_subject, price_text:price||null, hood_id:hoodDbId(hid), status:'selling'}).then(({error})=>{ if(error){toast(error.message);} else {loadJobs();} });
      tab='jobs'; jseg=kind;
    }else if(writeType===5){
      sb.from('posts').insert({author_id:uid, category:'0', is_official:false, title:subj||L().w_subject, body:desc||null, hood_id:hoodDbId(hid)}).then(({error})=>{ if(error){toast(error.message);} else {loadPosts();} });
      tab='community'; commSeg='info'; golfOpen=false;
    }
    writeOpen=false; render(); page.scrollTo(0,0); toast(L().w_posted); return;
  }
  /* 채팅 거래확정 · 안전거래 */
  if(e.target.closest('[data-dadvance]')){const c=chats[chatOpen];if(!c)return;const nd=(c.dst==='reserved')?'done':'reserved';c.dst=nd;render();if(c.listingId)persistListingStatus(c.listingId,nd);return;}
  if(e.target.closest('[data-report]')){reportOpen=true;render();return;}
  if(e.target.closest('[data-repclose]')){reportOpen=false;render();return;}
  if(e.target.closest('[data-repreason]')){reportOpen=false;render();toast(L().rep_done);return;}
  if(e.target.closest('[data-block]')){reportOpen=false;chatOpen=null;tab='chat';render();toast(L().block_done);return;}
  if(e.target.closest('[data-review]')){reviewOpen=true;render();return;}
  if(e.target.closest('[data-rvclose]')){reviewOpen=false;render();return;}
  const rvt=e.target.closest('[data-rvtoggle]'); if(rvt){rvt.classList.toggle('on');return;}
  if(e.target.closest('[data-rvsubmit]')){reviewOpen=false;render();toast(L().rv_done);return;}
  /* location picker */
  if(e.target.closest('#loccard')||e.target.closest('#locpill')){locPickerOpen=true;pickRegion=(city!=='all'?city:'bkk');render();return;}
  if(e.target.closest('#pscrim')||e.target.closest('#pclose')){locPickerOpen=false;render();return;}
  const pr=e.target.closest('[data-pr]'); if(pr){pickRegion=pr.dataset.pr;render();return;}
  const hd=e.target.closest('[data-hood]'); if(hd){city=pickRegion;hood=hoodById(hd.dataset.hood);verified=false;locPickerOpen=false;render();return;}
  const rad=e.target.closest('[data-rad]'); if(rad){radiusKm=+rad.dataset.rad;render();return;}
  if(e.target.closest('#gps')){
    if(!navigator.geolocation){toast(L().gps_denied);return;}
    toast(L().gps_locating);
    navigator.geolocation.getCurrentPosition(
      pos=>{const n=nearestHood(pos.coords.latitude,pos.coords.longitude);city=n.region;hood=n.h;verified=true;locPickerOpen=false;render();toast('📍 '+tx(hood)+L().v_suffix);},
      ()=>{toast(L().gps_denied);},
      {enableHighAccuracy:true,timeout:8000,maximumAge:0});
    return;
  }
  if(e.target.closest('[data-pall]')){city='all';hood=null;verified=false;locPickerOpen=false;render();return;}
  if(e.target.closest('.rangechip')){locPickerOpen=true;pickRegion=(city!=='all'?city:'bkk');render();return;}
  const nv=e.target.closest('[data-tab]'); if(nv){tab=nv.dataset.tab;chatOpen=null;storeOpen=null;cart={};golfOpen=false;listingOpen=null;render();page.scrollTo(0,0);return;}
  /* Golf Mate 연동 — 입장하기 → 공유계정 핸드오프 시트 */
  if(e.target.closest('[data-golf]')){gmGateOpen=true;render();return;}
  if(e.target.closest('#gmclose')||e.target.closest('#gmclose2')){gmGateOpen=false;render();return;}
  const gau=e.target.closest('[data-gmauth]'); if(gau){authed=true;render();return;}
  if(e.target.closest('[data-golfback]')){golfOpen=false;render();page.scrollTo(0,0);return;}
  const ga=e.target.closest('[data-gmact]'); if(ga){const k=ga.dataset.gmact;
    if(k==='used'){golfOpen=false;tab='market';mseg='sell';render();page.scrollTo(0,0);toast(lang==='ko'?'골프 장비는 ThaiMate 장터와 연동돼요':'Golf gear links to ThaiMate market');}
    else if(k==='handi'){toast(gm().ssTitle);}
    else{toast(gm().openFull+' →');}
    return;}
  const gr=e.target.closest('[data-gmround]'); if(gr){if(!canAct())return;toast(lang==='ko'?'라운딩 참여 신청 — 1:1 채팅으로 연결':'Round join request — opens 1:1 chat');return;}
  const ms=e.target.closest('[data-mseg]'); if(ms){mseg=ms.dataset.mseg;viewMarket();return;}
  const js=e.target.closest('[data-jseg]'); if(js){jseg=js.dataset.jseg;viewJobs();return;}
  const cm=e.target.closest('[data-comm]'); if(cm){commSeg=cm.dataset.comm;golfOpen=false;renderFab();viewCommunity();return;}
  const ic=e.target.closest('[data-icat]'); if(ic){icat=+ic.dataset.icat;viewCommunity();return;}
  const sc=e.target.closest('[data-shopcat]'); if(sc){shopCat=+sc.dataset.shopcat;viewShop();return;}
  const st=e.target.closest('[data-store]'); if(st){storeOpen=st.dataset.store;cart={};render();page.scrollTo(0,0);return;}
  const add=e.target.closest('[data-add]'); if(add){cart[add.dataset.add]=(cart[add.dataset.add]||0)+1;viewStore();return;}
  const sub=e.target.closest('[data-sub]'); if(sub){const k=sub.dataset.sub;cart[k]=(cart[k]||0)-1;if(cart[k]<=0)delete cart[k];viewStore();return;}
  if(e.target.closest('#doorder')){if(!canAct())return;const s=stores.find(x=>x.id===storeOpen);payStore=storeOpen;payAmount=s.menu.reduce((t,m)=>t+(cart[m.id]||0)*m.pr,0);payOpen=true;render();return;}
  if(e.target.closest('#spay')){payStore=storeOpen;payAmount=0;payOpen=true;render();return;}
  if(e.target.closest('#payscrim')||e.target.closest('#payclose')){payOpen=false;render();return;}
  if(e.target.closest('#paydone')){const s=stores.find(x=>x.id===payStore);placeOrder(s,payAmount,Object.assign({},cart));payOpen=false;cart={};storeOpen=null;tab='chat';chatOpen=null;render();toast(L().order_done);return;}
  if(e.target.closest('#sback')){storeOpen=null;cart={};render();return;}
  if(e.target.closest('#sinq')){storeOpen=null;tab='chat';chatOpen=null;render();return;}
  const ask=e.target.closest('.rb.ask'); if(ask){if(!canAct())return;toast(L().reply_demo);return;}
  const rx=e.target.closest('[data-react]'); if(rx){const [pid,ty]=rx.dataset.react.split(':');const p=info.find(x=>x.id===pid);
    if(p){ const on=(ty==='helpful')?!p.rHelp:!p.rSave;
      if(ty==='helpful'){p.rHelp=on; p.help=Math.max(0,(p.help||0)+(on?1:-1));} else {p.rSave=on; p.save=Math.max(0,(p.save||0)+(on?1:-1));}
      viewCommunity(); persistReaction(p,ty,on);
    } return;}
  const rb=e.target.closest('.rb'); if(rb){rb.classList.toggle('on');return;}
  const lk=e.target.closest('[data-like]'); if(lk){const it=listings.find(x=>x.id===lk.dataset.like);if(it)it.liked=!it.liked;render();return;}
  if(e.target.closest('[data-ldback]')){listingOpen=null;render();page.scrollTo(0,0);return;}
  const lch=e.target.closest('[data-lchat]'); if(lch){if(!canAct())return;const it=listings.find(x=>x.id===lch.dataset.lchat); openOrCreateChat(it); return;}
  const lo=e.target.closest('[data-listing]'); if(lo){listingOpen=lo.dataset.listing;render();page.scrollTo(0,0);return;}
  const cr=e.target.closest('[data-chat]'); if(cr){openChat(+cr.dataset.chat);return;}
  if(e.target.closest('#back')){chatOpen=null;render();return;}
  const mc=e.target.closest('[data-matchchat]'); if(mc){if(!canAct())return;openOrCreateChat(listings.find(x=>x.id===mc.dataset.matchchat));return;}
  const cc=e.target.closest('[data-cardchat]'); if(cc){if(!canAct())return;openOrCreateChat(listings.find(x=>x.id===cc.dataset.cardchat));return;}
  const jc=e.target.closest('[data-jobchat]'); if(jc){if(!canAct())return;openOrCreateChat(jobs.find(x=>x.id===jc.dataset.jobchat));return;}
  if(e.target.closest('#csend')){const i=document.getElementById('cin'); if(i&&i.value.trim()){sendMessage(i.value.trim());i.value='';} return;}
});
fab.addEventListener('click',()=>{if(!canAct())return;writeType=(tab==='shop'?6:(tab==='jobs'?3:(tab==='community'?5:0)));writeOpen=true;render();});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){searchQ=e.target.value;renderFsView();}});
document.addEventListener('keydown',e=>{if(e.target.id==='cin'&&e.key==='Enter'){const v=e.target.value.trim();if(v){sendMessage(v);e.target.value='';}}});

(async()=>{ try{ const {data}=await sb.auth.getSession(); await applySession(data.session); }catch(e){} render(); loadListings(); loadStores(); loadPosts(); loadJobs(); })();
</script>
</body>
</html>
