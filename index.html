<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Thai Mate — 동네 실시간 1:1 매칭 & 주문</title>
<!-- PWA: 홈 화면에 추가하면 앱처럼 전체화면 실행 -->
<meta name="theme-color" content="#ff7a33" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ThaiMate" />
<script>if('serviceWorker' in navigator){
  // 새 서비스워커가 제어를 넘겨받으면(=새 버전 배포) 자동 새로고침 → 설치형 PWA도 옛 코드에 갇히지 않음
  var __swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(__swReloaded)return; __swReloaded=true; location.reload(); });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').then(function(reg){
      try{ reg.update(); }catch(e){}
      // 대기 중인 새 워커가 있으면 즉시 활성화
      if(reg.waiting){ try{ reg.waiting.postMessage({type:'SKIP_WAITING'}); }catch(e){} }
      reg.addEventListener('updatefound',function(){ var nw=reg.installing; if(!nw)return;
        nw.addEventListener('statechange',function(){ if(nw.state==='installed' && navigator.serviceWorker.controller){ try{ nw.postMessage({type:'SKIP_WAITING'}); }catch(e){} } });
      });
    }).catch(function(){});
  });
}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --ink:#191b1d; --sub:#8a9099; --line:#ececec;
    --pri:#ff7a33; --pri-soft:#fff1e8; --blue:#2f6df0; --green:#15a05a; --gold:#f5a524; --red:#ef4444;
    --shadow:0 1px 2px rgba(20,24,30,.05),0 8px 22px rgba(20,24,30,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#d7dae0;font-family:"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  .device{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
  .top-row{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.3px}
  .brand .logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--pri),#ffa869);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900}
  .ttl{font-weight:700;font-size:13.5px;color:var(--sub)}
  .spacer{flex:1}
  .icon-btn{width:36px;height:36px;border:none;background:transparent;border-radius:10px;font-size:18px;display:grid;place-items:center;cursor:pointer}
  .lang{display:flex;background:#f0f1f4;border-radius:10px;padding:3px}
  .lang button{border:none;background:transparent;font-size:11.5px;font-weight:700;color:var(--sub);padding:5px 8px;border-radius:8px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--pri);box-shadow:var(--shadow)}
  .cities{display:flex;gap:7px;padding:0 14px 11px;overflow-x:auto;scrollbar-width:none}
  .cities::-webkit-scrollbar{display:none}
  .city{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .city.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg{display:flex;background:#f0f1f4;border-radius:12px;padding:4px;margin:0 0 14px}
  .seg button{flex:1;border:none;background:transparent;font-weight:800;font-size:13.5px;color:var(--sub);padding:10px 0;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .page{flex:1;overflow-y:auto;padding:14px 14px 96px}
  .page::-webkit-scrollbar{display:none}
  .vbanner{display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,#fff1e8,#fff8f3);border:1px solid #ffd9c2;border-radius:13px;padding:11px 13px;margin-bottom:14px}
  .vbanner .em{font-size:20px}
  .vbanner b{font-size:13px;letter-spacing:-.2px}
  .vbanner p{margin:2px 0 0;font-size:11.5px;color:#b9620f;line-height:1.35}
  .livebar{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#15a05a;margin:0 2px 12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#15a05a;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,160,90,.45)}70%{box-shadow:0 0 0 9px rgba(21,160,90,0)}100%{box-shadow:0 0 0 0 rgba(21,160,90,0)}}
  .list{display:flex;flex-direction:column;gap:11px}
  /* C2C listing card */
  .card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow);cursor:pointer}
  .thumb{width:84px;height:84px;flex:0 0 84px;border-radius:12px;background:linear-gradient(135deg,#eef1f6,#e2e7f0);display:grid;place-items:center;font-size:36px;position:relative;overflow:hidden}
  .thumb.want{background:linear-gradient(135deg,#fff1e8,#ffe2cf)}
  .thumb.give{background:linear-gradient(135deg,#e7f7ee,#d2f0e0)}
  .badge{position:absolute;left:5px;top:5px;font-size:9.5px;font-weight:800;padding:3px 6px;border-radius:6px;color:#fff}
  .badge.sale{background:var(--green)} .badge.resv{background:var(--gold)} .badge.done{background:#9aa0a8} .badge.match{background:var(--pri)}
  .cbody{flex:1;min-width:0}
  .ctitle{font-size:14.5px;font-weight:700;line-height:1.32;letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cmeta{font-size:11.5px;color:var(--sub);margin-top:4px}
  .price{font-size:16px;font-weight:900;margin-top:6px}
  .actions{display:flex;align-items:center;gap:8px;margin-top:9px}
  .abtn{border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12px;font-weight:700;color:#4b5563;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .abtn.chat{background:var(--pri);border-color:var(--pri);color:#fff}
  .live-mini{margin-left:auto;font-size:11px;color:var(--green);font-weight:700}
  .abtn.like.on{color:var(--red);border-color:#f6c9c4;background:#fdeceb}
  /* listing detail */
  .ldphoto{height:210px;display:grid;place-items:center;font-size:80px;position:relative;background:linear-gradient(135deg,#eef1f6,#e2e7f0);border-radius:16px;margin-bottom:6px}
  .ldphoto.want{background:linear-gradient(135deg,#fff1e8,#ffe2cf)} .ldphoto.give{background:linear-gradient(135deg,#e7f7ee,#d2f0e0)}
  .ldphoto .badge{left:12px;top:12px;font-size:11px;padding:4px 9px}
  .ldseller{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .ldseller .avatar{width:44px;height:44px;flex:0 0 44px}
  .ldseller b{font-size:14px} .ldseller .lds{font-size:11.5px;color:var(--sub);margin-top:2px}
  .ldtitle{font-size:18px;font-weight:800;letter-spacing:-.3px;margin:15px 2px 6px;line-height:1.35}
  .ldmeta{font-size:12px;color:var(--sub);margin:0 2px}
  .ldprice{font-size:22px;font-weight:900;margin:11px 2px}
  .lddesc{font-size:14px;color:#374151;line-height:1.65;margin:0 2px;white-space:pre-wrap}
  .ldbar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;background:#fff;border-top:1px solid var(--line);padding:12px 2px;margin:18px -14px 0}
  .ldbar .ldlike{width:50px;height:50px;flex:0 0 50px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:22px;cursor:pointer;margin-left:14px}
  .ldbar .ldlike.on{border-color:#f6c9c4;background:#fdeceb}
  .ldbar .ldchat{flex:1;border:none;background:var(--pri);color:#fff;font-weight:800;font-size:15px;padding:15px;border-radius:13px;cursor:pointer;margin-right:14px}
  /* shop (광고) */
  .scard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--shadow);cursor:pointer;margin-bottom:11px}
  .sthumb{width:72px;height:72px;flex:0 0 72px;border-radius:13px;background:linear-gradient(135deg,#fff1e8,#ffe2cf);display:grid;place-items:center;font-size:34px;position:relative}
  .adb{position:absolute;left:4px;top:4px;font-size:9px;font-weight:800;background:#191b1d;color:#ffd27a;padding:2px 6px;border-radius:6px}
  .sbody{flex:1;min-width:0}
  .snm{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .smeta{font-size:12px;color:#4b5563;margin-top:3px}
  .sgray{color:var(--sub)}
  .spills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pill{font-size:11px;font-weight:700;color:#4b5563;background:#f1f3f6;border-radius:8px;padding:5px 9px}
  .sgo{align-self:center;color:#c2c7d0;font-size:20px}
  .orderbtn{font-size:12px;font-weight:800;color:#fff;background:var(--pri);border-radius:9px;padding:8px 12px}
  /* store detail */
  .detail-head{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
  .back{border:none;background:#eef0f3;border-radius:9px;font-size:22px;font-weight:800;cursor:pointer;padding:5px 12px;line-height:1;color:#333;flex:0 0 auto}
  .detail-head .hn{font-size:15px;font-weight:800}
  .detail-head .hs{font-size:11.5px;color:var(--sub);margin-top:2px}
  .storebanner{height:120px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#fff1e8,#ffe0cb)}
  .msec{font-size:13px;font-weight:800;color:var(--sub);margin:12px 2px 8px}
  .mrow2{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #f4f4f2}
  .memo{width:52px;height:52px;flex:0 0 52px;border-radius:11px;background:#f4f5f7;display:grid;place-items:center;font-size:26px}
  .mmid{flex:1;min-width:0}
  .mnm{font-size:14px;font-weight:600}
  .mpr{font-size:14px;font-weight:900;margin-top:3px}
  .stepper{display:flex;align-items:center;gap:9px}
  .stbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:17px;font-weight:800;color:var(--ink);cursor:pointer;display:grid;place-items:center}
  .stbtn.add{background:var(--pri);border-color:var(--pri);color:#fff}
  .qn{min-width:18px;text-align:center;font-weight:800;font-size:14px}
  .cartbar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;background:#191b1d;color:#fff;border-radius:14px;padding:11px 12px 11px 16px;margin:14px 2px 0;box-shadow:0 8px 22px rgba(0,0,0,.25)}
  .cc{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--pri);font-size:12px;font-weight:800;padding:0 6px}
  .ct{font-size:14px;font-weight:800}
  .orderfab{margin-left:auto;border:none;background:var(--pri);color:#fff;font-weight:800;font-size:14px;padding:11px 18px;border-radius:11px;cursor:pointer}
  .bigbtn{width:100%;border:none;background:var(--pri);color:#fff;font-weight:800;font-size:15px;padding:14px;border-radius:13px;cursor:pointer;margin-top:14px}
  /* chat */
  .chatrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);cursor:pointer}
  .avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#eef1f6}
  .chatrow .ci{flex:1;min-width:0}
  .chatrow .cn{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
  .chip{font-size:10px;font-weight:800;color:var(--pri);background:var(--pri-soft);border-radius:6px;padding:2px 6px}
  .chatrow .lastmsg{font-size:12.5px;color:#6b7280;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chatrow .cr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .chatrow .tm{font-size:11px;color:var(--sub)}
  .unread{min-width:19px;height:19px;border-radius:999px;background:var(--pri);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
  .secure{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#15a05a;background:#eaf7ef;padding:8px;margin:0}
  .deal{display:flex;gap:10px;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}
  .deal .dn{font-size:12.5px;font-weight:700}
  .deal .dp{font-size:13px;font-weight:900}
  .msgs{padding:14px 12px;display:flex;flex-direction:column;gap:9px;background:#f6f6f4;min-height:42vh}
  .bub{max-width:76%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.4}
  .bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .bub.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
  .inbar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}
  .inbar input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 14px;font-size:13px;outline:none}
  .inbar .send{border:none;background:var(--pri);color:#fff;border-radius:999px;width:42px;font-size:18px;cursor:pointer}
  /* info */
  .ipost{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:11px}
  .imeta{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .itag{font-size:10.5px;font-weight:800;color:var(--blue);background:#eaf2ff;border-radius:7px;padding:3px 8px}
  .otag{font-size:10.5px;font-weight:800;color:#fff;background:var(--red);border-radius:7px;padding:3px 8px}
  .idot{font-size:11.5px;color:var(--sub);margin-left:auto}
  .ititle{margin:0;font-size:15px;font-weight:700;line-height:1.35;letter-spacing:-.2px}
  .iexc{margin:5px 0 0;font-size:12.5px;color:#4b5563;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ireact{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
  .rb{border:1px solid var(--line);background:#fff;border-radius:9px;font-size:11.5px;font-weight:700;color:#5b6472;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .rb b{font-weight:800}
  .rb.on{color:var(--pri);border-color:var(--pri);background:var(--pri-soft)}
  .rb.ask{color:var(--pri);border-color:#ffd2b8;background:var(--pri-soft)}
  .iviews{font-size:11px;color:var(--sub);margin-left:auto}
  /* clubs */
  .club{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;margin-bottom:12px}
  .club .banner{height:46px;display:flex;align-items:flex-end;padding:8px 14px;color:#fff;font-weight:800;font-size:17px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .club .cbody2{padding:12px 14px}
  .club .desc{font-size:12.5px;color:#4b5563;line-height:1.45}
  .club .cfoot{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:12px;color:var(--sub)}
  .flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--gold);background:#fff7e8;border:1px solid #ffe6b3;border-radius:999px;padding:4px 10px}
  .join{margin-left:auto;border:none;background:var(--pri);color:#fff;font-weight:800;font-size:12.5px;padding:8px 16px;border-radius:10px;cursor:pointer}
  /* me */
  .profile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);text-align:center;margin-bottom:14px}
  .pav{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--pri),#ffa869);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 10px}
  .pname{font-size:17px;font-weight:800}
  .trust{display:inline-flex;align-items:center;gap:6px;margin-top:7px;background:#eaf7ef;color:var(--green);font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px}
  .mannerbar{height:7px;border-radius:999px;background:#eef1f6;margin:14px 0 4px;overflow:hidden}
  .mannerbar i{display:block;height:100%;width:88%;background:linear-gradient(90deg,#ffd27a,var(--green))}
  .menu{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-top:14px}
  .mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer}
  .mrow:last-child{border-bottom:none}
  .mrow .ar{margin-left:auto;color:#c2c7d0}
  .mrow .em{font-size:18px;width:24px;text-align:center}
  .multilang-note{font-size:10.5px;color:var(--sub);background:#eef0f3;border-radius:7px;padding:2px 7px;margin-left:6px}
  .sech{font-size:15px;margin:2px 2px 11px;letter-spacing:-.3px;font-weight:800}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:46px 0}
  /* fab + nav + toast */
  .fab{position:absolute;right:16px;bottom:84px;z-index:25;height:50px;border-radius:999px;background:var(--pri);color:#fff;border:none;font-size:14px;font-weight:800;box-shadow:0 8px 22px rgba(255,122,51,.45);cursor:pointer;display:flex;align-items:center;gap:7px;padding:0 18px}
  .nav{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 2px 10px}
  .nav button{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;color:#9aa1ad;font-size:10px;font-weight:700;position:relative}
  .nav button .ic{font-size:20px;line-height:1}
  .nav button.on{color:var(--pri)}
  .nav .ndot{position:absolute;top:2px;right:50%;transform:translateX(14px);min-width:15px;height:15px;border-radius:999px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#191b1d;color:#fff;font-size:12.5px;font-weight:600;padding:11px 16px;border-radius:11px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:88%;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.3)}
  .toast.show{opacity:1}
  /* gate */
  .gate{display:none;flex-direction:column;min-height:100vh;background:linear-gradient(165deg,#ffffff,#fff6f0 52%,#ffe7d6);padding:0 22px;position:relative}
  .glang{position:absolute;top:14px;right:16px}
  .ghero{text-align:center;padding:62px 0 6px}
  .glogo{width:74px;height:74px;border-radius:23px;background:linear-gradient(135deg,var(--pri),#ffa869);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:900;margin:0 auto 16px;box-shadow:0 14px 30px rgba(255,122,51,.42)}
  .gname{font-size:27px;font-weight:900;letter-spacing:-.6px}
  .gname span{color:var(--pri)}
  .gtag{font-size:13.5px;color:var(--sub);margin-top:9px;line-height:1.55;font-weight:600}
  .gmid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:13px;padding:8px 0}
  .loccard{position:relative;overflow:hidden;border-radius:18px;padding:15px 16px;min-height:122px;display:flex;flex-direction:column;justify-content:flex-end;background:#cfd8e0 url('assets/thai-temple.jpg') center/cover no-repeat;box-shadow:0 12px 28px rgba(150,80,30,.3);cursor:pointer}

  return enc+'@thaimate.app';

function mateChime(){
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!__mateAC)__mateAC=new AC(); const ctx=__mateAC; if(ctx.state==='suspended')ctx.resume();

function subscribeChat(chatId){

  try{ chatSub=sb.channel('chat-'+chatId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'chat_id=eq.'+chatId}, payload=>{
    const m=payload.new; if(m.sender_id===uid) return;
    const c=chats.find(x=>x.id===chatId); if(!c) return; c.msgs=c.msgs||[];
    if(c.msgs.some(x=>x.id===m.id)) return;
    c.msgs.push({me:false,tx:m.body,id:m.id});
    if(chatOpen!==null&&chats[chatOpen]&&chats[chatOpen].id===chatId){ render(); page.scrollTo(0,9999); }
  }).subscribe(); }catch(e){}
}
async function sendMessage(text){

const LINE_FN_URL='https://jhtsncdeoulanvytfwrl.functions.supabase.co/line-login';

function lineLogin(){
  if(!LINE_CHANNEL_ID){ toast(lang==='ko'?'LINE 로그인 준비 중이에요 (곧 지원)':lang==='th'?'LINE กำลังเตรียม':'LINE login coming soon'); return; }
  try{ localStorage.setItem('loginGoHome','1'); }catch(e){}   // 로그인 직후 홈 허브로
  // 인앱 브라우저(특히 LINE 자체 인앱)에선 LINE 앱 로그인(app-to-app)이 막혀 웹폼 "로그인 불가"가 뜸
  //  → 누르는 즉시 조용히 외부 브라우저(Safari/Chrome)로 튕기고, 거기서 goline=1로 LINE 로그인 자동 재개 (무음, extBounce 무시)
  if(window.__inAppLine || window.__inAppKakao){
    const rs=location.origin+'/?goline=1';
    if(window.__inAppKakao){ location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(rs); }
    else { try{ location.replace(rs+'&openExternalBrowser=1'); }catch(e){ location.href=rs+'&openExternalBrowser=1'; } }
    return;
  }
  const st=Math.random().toString(36).slice(2)+Date.now(); try{ localStorage.setItem('lineState',st); sessionStorage.setItem('lineState',st); }catch(e){}   // 모바일 컨텍스트 전환(LINE앱↔브라우저)에도 살아남게 localStorage 병행
  location.href='https://access.line.me/oauth2/v2.1/authorize?response_type=code'
    +'&client_id='+encodeURIComponent(LINE_CHANNEL_ID)
    +'&redirect_uri='+encodeURIComponent(location.origin+'/')
    +'&state='+st+'&scope='+encodeURIComponent('openid profile');
}
async function handleLineCallback(){   // LINE 콜백(?code&state)만 처리 — Google/Kakao(PKCE)는 supabase-js가 자동 처리
  try{
    const q=new URLSearchParams(location.search); const code=q.get('code'), state=q.get('state');
    if(!code) return false;   // 콜백 아님
    let saved=null; try{ saved=localStorage.getItem('lineState')||sessionStorage.getItem('lineState'); }catch(e){}
    if(!saved) return false;  // LINE state 없으면 우리 플로우 아님(구글/카카오 PKCE는 supabase-js가 처리)
    if(state && state!==saved) return false;   // CSRF: state 불일치 시 무시
    try{ localStorage.removeItem('lineState'); sessionStorage.removeItem('lineState'); }catch(e){}
    const r=await fetch(LINE_FN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code, redirect_uri:location.origin+'/'})});
    const j=await r.json().catch(()=>null);
    try{ history.replaceState({},'',location.origin+'/'); }catch(e){}
    if(j&&j.token_hash){
      const {data:vd,error:ve}=await sb.auth.verifyOtp({type:'magiclink', token_hash:j.token_hash});
      if(ve){ toast('LINE 로그인 실패: '+(ve.message||ve)); return true; }
      const sess=(vd&&vd.session)||(await sb.auth.getSession()).data.session;
      if(sess){ gateMode='home'; tab='home'; try{ localStorage.removeItem('loginGoHome'); }catch(e){} await applySession(sess); render(); toast(L().e_login_ok); }
    } else { toast('LINE: '+((j&&j.error)||'응답 오류')); }
    return true;
  }catch(e){ toast('LINE 콜백 오류: '+(e.message||e)); return false; }
}

function hoodById(id){for(const r in REGIONS){const h=REGIONS[r].hoods.find(x=>x.id===id);if(h)return h;}return null;}
function distanceKm(a,b){
  if(!a||!b||a.lat==null||b.lat==null) return 9999;
  const R=6371,toR=d=>d*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function nearestHood(lat,lng){let best=null,bd=1e9;for(const r in REGIONS)for(const h of REGIONS[r].hoods){const d=distanceKm({lat,lng},h);if(d<bd){bd=d;best={region:r,h};}}return best;}
function itemDist(it){const ih=it.hoodId?hoodById(it.hoodId):null;return (hood&&ih)?distanceKm(hood,ih):9999;}
function inRange(it){
  if(city==='all'||it.city==='all') return true;
  if(it.city!==city) return false;
  if(!hood) return true;
  const ih=it.hoodId?hoodById(it.hoodId):null;
  if(!ih) return true;
  if(radiusKm===0) return ih.id===hood.id;
  return distanceKm(hood,ih)<=radiusKm;
}

function subscribeClubMsgs(clubId){
  clubChatStop();
  try{ clubChatSub=sb.channel('clubchat-'+clubId).on('postgres_changes',{event:'INSERT',schema:'public',table:'club_messages',filter:'club_id=eq.'+clubId}, payload=>{
    const m=payload.new; if(m.sender_id===uid) return;
    if(!clubData||clubOpen!==clubId) return; clubData.cmsgs=clubData.cmsgs||[];
    if(clubData.cmsgs.some(x=>x.id===m.id)) return;

    refreshClubChatBox();
  }).subscribe(); }catch(e){}
}

function openClubEdit(c){
  if(!c) return;
  wClub={name:c.name||'', emoji:c.emoji||'👥', intro:c.intro||'', cat:c.category||'etc', region:c.region||'', grad:c.grad||CLUB_GRADS[0]};
  clubEditId=c.id; clubCreateOpen=true; render(); page.scrollTo(0,0);
}
async function updateClub(){
  if(!clubEditId || clubBusy) return;
  const name=((document.getElementById('clName')||{}).value||'').trim();
  if(!name){ toast(lang==='ko'?'모임 이름을 입력하세요':lang==='th'?'กรอกชื่อชมรม':'Enter a club name'); return; }
  const emoji=(((document.getElementById('clEmoji')||{}).value||'').trim())||'👥';
  const intro=((document.getElementById('clIntro')||{}).value||'').trim();
  const cat=(document.getElementById('clCat')||{}).value||'etc';
  const region=((document.getElementById('clRegion')||{}).value||'').trim();
  const id=clubEditId; clubBusy=true;
  try{
    const {data,error}=await sb.from('clubs').update({name,emoji,intro:intro||null,category:cat,region:region||null,grad:wClub.grad}).eq('id',id).select('id');
    if(error){ toast(error.message); clubBusy=false; return; }
    if(!data||!data.length){ toast(lang==='ko'?'수정 권한이 없어요 (방장/관리자만)':lang==='th'?'ไม่มีสิทธิ์แก้ไข':'No permission (leader/admin only)'); clubBusy=false; return; }
    clubCreateOpen=false; clubEditId=null; wClub={emoji:'👥',grad:CLUB_GRADS[0],cat:'etc'};
    await loadClubs(); clubBusy=false; render();
    toast(lang==='ko'?'모임 정보를 수정했어요':lang==='th'?'แก้ไขแล้ว':'Club updated');
  }catch(e){ toast(String(e.message||e)); clubBusy=false; }
}
async function createClub(){
  if(!canAct()) return; if(clubBusy) return;
  const name=((document.getElementById('clName')||{}).value||'').trim();
  if(!name){ toast(lang==='ko'?'모임 이름을 입력하세요':lang==='th'?'กรอกชื่อชมรม':'Enter a club name'); return; }
  const emoji=(((document.getElementById('clEmoji')||{}).value||'').trim())||'👥';
  const intro=((document.getElementById('clIntro')||{}).value||'').trim();
  const cat=(document.getElementById('clCat')||{}).value||'etc';
  const region=((document.getElementById('clRegion')||{}).value||'').trim();
  clubBusy=true;
  try{
    const row={name,emoji,intro:intro||null,category:cat,region:region||null,grad:wClub.grad,leader_id:uid,approved:false};   // 모든 모임은 관리자 승인 후 공개
    const {data,error}=await sb.from('clubs').insert(row).select().single();
    if(error){ toast(error.message); clubBusy=false; return; }
    clubCreateOpen=false; wClub={emoji:'👥',grad:CLUB_GRADS[0],cat:'etc'};
    toast(lang==='ko'?'개설 신청 완료 — 관리자 승인을 기다려 주세요':lang==='th'?'ส่งคำขอแล้ว — รอแอดมินอนุมัติ':'Submitted — awaiting admin approval');
    await loadClubs(); clubBusy=false;
    // 승인 전이라 자동 입장 안 함
  }catch(e){ toast(String(e.message||e)); clubBusy=false; }
}
async function approveClub(id, ok){
  if(!ok && !confirm(lang==='ko'?'이 골프 동호회 개설을 거절(삭제)할까요?':lang==='th'?'ปฏิเสธ(ลบ)ชมรมนี้?':'Reject (delete) this club?')) return;
  try{ const {error}=await sb.rpc('club_approve',{p_club:id,p_ok:ok}); if(error){ toast(error.message); return; }
    toast(ok?(lang==='ko'?'동호회 승인 완료':lang==='th'?'อนุมัติแล้ว':'Approved'):(lang==='ko'?'개설 거절됨':lang==='th'?'ปฏิเสธแล้ว':'Rejected')); await loadClubs(); render();
  }catch(e){ toast(String(e.message||e)); }
}

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.querySelector('.device').appendChild(t);}
  t.textContent=msg;t.classList.add('show');
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1900);
}

// 영업시간 기준 현재 영업 여부(태국시각). 수동 종료(s.open=false)·휴무(s.holiday)면 닫힘. 영업시간 미설정이면 수동 상태 따름.
function storeOpenNow(s){
  if(!s) return false;
  if(s.open===false) return false;
  if(s.holiday) return false;
  if(!s.hoursOpen || !s.hoursClose) return true;
  try{
    var th=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Bangkok'}));
    var wsDay=(th.getDay()+6)%7;   // JS(일=0) → WS days(월=0) 변환
    if(!s.hoursAll && Array.isArray(s.hoursDays) && s.hoursDays.length && s.hoursDays.indexOf(wsDay)<0) return false;  // 오늘은 영업일 아님
    var pm=function(t){ var m=/^(\d{1,2}):(\d{2})/.exec(t||''); return m?(+m[1]*60+(+m[2])):null; };
    var op=pm(s.hoursOpen), cl=pm(s.hoursClose); if(op==null||cl==null) return true;
    var cur=th.getHours()*60+th.getMinutes();
    return cl>op ? (cur>=op&&cur<cl) : (cur>=op||cur<cl);   // 자정 넘김(예 18:00~02:00) 지원
  }catch(e){ return true; }
}

// 텍스트 안의 URL을 클릭 가능한 링크로 (HTML 이스케이프 후 링크화 — XSS 방지)
function linkify(t){
  if(t==null) return '';
  var esc=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/((?:https?:\/\/|www\.)[^\s<]+)/gi,function(u){ var href=/^https?:\/\//i.test(u)?u:('https://'+u); return '<a href="'+href+'" target="_blank" rel="noopener" style="color:#2f6df0;text-decoration:underline;word-break:break-all">'+u+'</a>'; });
}

// 사진 라이트박스(전체화면, 좌우 넘김, 안 잘림)
function openLightbox(photos,idx){
  if(!photos||!photos.length) return;
  var cur=idx||0;
  var ov=document.createElement('div');
  ov.className='lightbox';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99999;display:flex;align-items:center;justify-content:center';
  function paint(){
    ov.innerHTML=`<img src="${escA(photos[cur])}" style="max-width:96vw;max-height:84vh;object-fit:contain;border-radius:6px">`
      +`<button data-lbx="close" style="position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer">✕</button>`
      +(photos.length>1?`<button data-lbx="prev" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);width:48px;height:64px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:30px;cursor:pointer">‹</button>`
        +`<button data-lbx="next" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:48px;height:64px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:30px;cursor:pointer">›</button>`
        +`<div style="position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:700">${cur+1} / ${photos.length}</div>`:'');
  }
  paint();
  ov.addEventListener('click',function(e){
    var b=e.target.closest('[data-lbx]');
    if(b){ var a=b.dataset.lbx;
      if(a==='prev'){cur=(cur-1+photos.length)%photos.length;paint();return;}
      if(a==='next'){cur=(cur+1)%photos.length;paint();return;}
    }
    ov.remove();   // 화살표(‹ ›) 외 어디를 눌러도(사진·배경·✕) 닫힘
  });
  document.body.appendChild(ov);
}

/* ── 동반자 모집 (golf_matches 보드 + 네이티브 1:1 채팅) ── */
async function openGolfMatches(){ golfSub='match'; golfMatchForm=false; golfMatchEdit=null; golfMatchOpen=null; render(); page.scrollTo(0,0); await loadGolfMatches(); }
async function loadGolfMatches(){
  try{
    const {data}=await sb.from('golf_matches').select('*').order('play_date',{ascending:true,nullsFirst:false}).order('created_at',{ascending:false});
    const ms=data||[]; const ids=ms.map(m=>m.id); const parts={}; const names={};
    if(ids.length){ try{ const p=await sb.from('golf_match_participants').select('match_id,user_id,status').in('match_id',ids);
      (p.data||[]).forEach(r=>{ (parts[r.match_id]=parts[r.match_id]||[]).push(r); }); }catch(e){} }
    const allUserIds=[...new Set([...ms.map(m=>m.host_id), ...Object.values(parts).flat().map(r=>r.user_id)])];
    if(allUserIds.length){ try{ const pr=await sb.from('profiles').select('id,nickname,handicap,hood_id').in('id',allUserIds); (pr.data||[]).forEach(r=>names[r.id]=r); }catch(e){} }
    golfMatchProfiles=names;
    ms.forEach(m=>{ const ps=parts[m.id]||[]; m._parts=ps; m._approved=ps.filter(r=>r.status==='approved').length; m._pending=ps.filter(r=>r.status==='pending'); const mine=ps.find(r=>r.user_id===uid); m._myStatus=mine?mine.status:null; m._host=(names[m.host_id]&&names[m.host_id].nickname)||(lang==='ko'?'호스트':lang==='th'?'โฮสต์':'Host'); });
    golfMatches=ms; if(golfSub==='match') render();
  }catch(e){}
}
function mpName(u){ return (golfMatchProfiles[u]&&golfMatchProfiles[u].nickname)||(lang==='ko'?'회원':lang==='th'?'สมาชิก':'Member'); }
function mpHcp(u){ const p=golfMatchProfiles[u]; return p&&p.handicap!=null?p.handicap:'-'; }
async function createGolfMatch(){
  if(!canAct()) return;
  const v=id=>((document.getElementById(id)||{}).value||'').trim();
  const course=v('gmCourse'); if(!course){ toast(lang==='ko'?'골프장을 입력하세요':lang==='th'?'กรอกสนาม':'Enter course'); return; }

// key: 27·36홀 코스에서 'A+B' 처럼 칠 두 나인 지정
function coursePars18(co, key){
  if(!co||!co.pars) return null; const p=co.pars;
  if(Array.isArray(p)) return p.length===18?p.map(x=>+x):null;
  if(typeof p==='object'){
    if(key){ const ks=String(key).split('+').map(s=>s.trim()); if(ks.length===2 && Array.isArray(p[ks[0]]) && Array.isArray(p[ks[1]]) && p[ks[0]].length===9 && p[ks[1]].length===9) return [...p[ks[0]],...p[ks[1]]].map(x=>+x); }
    if(Array.isArray(p.main)&&p.main.length===18) return p.main.map(x=>+x);
    const keys9=Object.keys(p).filter(k=>Array.isArray(p[k])&&p[k].length===9);
    if(keys9.length>=2) return [...p[keys9[0]],...p[keys9[1]]].map(x=>+x);
    const any18=Object.values(p).find(v=>Array.isArray(v)&&v.length===18);
    if(any18) return any18.map(x=>+x);
  }
  return null;
}
// 27·36홀: 칠 수 있는 나인 조합 목록 (나인 3개 이상일 때만 선택 필요)
function courseCombos(co){
  if(!co||!co.pars||typeof co.pars!=='object'||Array.isArray(co.pars)) return [];
  const keys=Object.keys(co.pars).filter(k=>Array.isArray(co.pars[k])&&co.pars[k].length===9);
  if(keys.length<3) return [];
  const out=[]; for(let i=0;i<keys.length;i++)for(let j=i+1;j<keys.length;j++) out.push({key:keys[i]+'+'+keys[j], label:keys[i]+' + '+keys[j]});
  return out;
}

/* ===== 시상 프로세스 (골프 동호회 내 정기 라운드 — events/event_participants/event_awards) =====
   점수 계산은 골프메이트 로직 그대로 카피: 신페리오/스테이블포드/그로스/넷 + 카운트백 */
const GOLF_DEFAULT_PAR=[4,5,4,3,5,4,5,4,3,4,5,4,4,5,4,3,5,4];
function calcPeoria(holes, peoriaHoles, holePars){
  if(!Array.isArray(holes)||holes.length<18||!Array.isArray(peoriaHoles)) return null;
  let s=0; for(const h of peoriaHoles) s+=holes[h-1]||0;
  const coursePar=(Array.isArray(holePars)&&holePars.length===18)?holePars.reduce((a,b)=>a+(b||0),0):72;
  const raw=(s*1.5-coursePar)*0.8; let hcp=raw; if(hcp<0)hcp=0; if(hcp>36)hcp=36;
  const gross=holes.reduce((a,b)=>a+b,0);
  return { handicap:Math.round(hcp*10)/10, net:Math.round((gross-hcp)*10)/10, hidden:s, coursePar, gross, capped:(raw!==hcp) };
}
// 스테이블포드 점수표 — 변형이 많아 동호회 관리자가 직접 입력(7단계)
const STABLE_DEF={hio:6,albatross:5,eagle:4,birdie:3,par:2,bogey:1,dbogey:0};
const STABLE_KEYS=['hio','albatross','eagle','birdie','par','bogey','dbogey'];
const STABLE_LABEL={ko:{hio:'홀인원',albatross:'알바트로스',eagle:'이글',birdie:'버디',par:'파',bogey:'보기',dbogey:'더블보기↑'},en:{hio:'Hole-in-one',albatross:'Albatross',eagle:'Eagle',birdie:'Birdie',par:'Par',bogey:'Bogey',dbogey:'Dbl bogey+'},th:{hio:'โฮลอินวัน',albatross:'อัลบาทรอส',eagle:'อีเกิล',birdie:'เบอร์ดี้',par:'พาร์',bogey:'โบกี้',dbogey:'ดับเบิลโบกี้+'}};
function stablePts(p){ const o={}; for(const k of STABLE_KEYS) o[k]=(p&&p[k]!=null&&p[k]!=='')?+p[k]:STABLE_DEF[k]; return o; }
function stableCat(s, par){ if(s===1) return 'hio'; const d=s-par; if(d<=-3)return 'albatross'; if(d===-2)return 'eagle'; if(d===-1)return 'birdie'; if(d===0)return 'par'; if(d===1)return 'bogey'; return 'dbogey'; }
function calcStableford(holes, parsArr, ptsTable){
  const P=(Array.isArray(parsArr)&&parsArr.length===18)?parsArr:GOLF_DEFAULT_PAR;
  if(!Array.isArray(holes)||holes.length<18) return null;
  const PT=stablePts(ptsTable); let pts=0;
  for(let i=0;i<18;i++){ const par=P[i]||4, s=holes[i]; if(s==null||s==='')continue; pts+=PT[stableCat(+s,par)]||0; }
  return pts;
}
function calcStablefordNet(holes, parsArr, handicap, ptsTable){
  const P=(Array.isArray(parsArr)&&parsArr.length===18)?parsArr:GOLF_DEFAULT_PAR;
  if(!Array.isArray(holes)||holes.length<18) return null;
  const PT=stablePts(ptsTable);
  const hcp=(typeof handicap==='number'&&handicap>0)?Math.min(36,Math.floor(handicap)):0;
  const base=Math.floor(hcp/18), extra=hcp%18; let pts=0;
  for(let i=0;i<18;i++){ const par=P[i]||4, s=holes[i]; if(s==null||s==='')continue;
    if(+s===1){ pts+=PT.hio; continue; }
    const bonus=base+(i<extra?1:0); const net=(+s)-bonus;
    const d=net-par; const cat=d<=-3?'albatross':d===-2?'eagle':d===-1?'birdie':d===0?'par':d===1?'bogey':'dbogey';
    pts+=PT[cat]||0; }
  return pts;
}
function stableBreakdown(holes, parsArr, ptsTable, ko, handicap){
  const P=(Array.isArray(parsArr)&&parsArr.length===18)?parsArr:GOLF_DEFAULT_PAR;
  const PT=stablePts(ptsTable); const isNet=(typeof handicap==='number');
  const hcp=isNet?Math.min(36,Math.max(0,Math.floor(handicap||0))):0; const base=Math.floor(hcp/18), extra=hcp%18;
  const cnt={}; let total=0;
  for(let i=0;i<18;i++){ const par=P[i]||4, s=holes[i]; if(s==null||s==='')continue;
    let cat; if(+s===1)cat='hio'; else if(isNet){ const net=(+s)-(base+(i<extra?1:0)); const d=net-par; cat=d<=-3?'albatross':d===-2?'eagle':d===-1?'birdie':d===0?'par':d===1?'bogey':'dbogey'; } else cat=stableCat(+s,par);
    cnt[cat]=(cnt[cat]||0)+1; total+=PT[cat]||0; }
  const L=STABLE_LABEL[ko?'ko':'en']||STABLE_LABEL.en;
  const parts=STABLE_KEYS.filter(k=>cnt[k]).map(k=>`${L[k]} ${cnt[k]}×${PT[k]}`);
  return parts.join(' · ')+` = ${total}${ko?'점':'pt'}`+(isNet?(ko?` (핸디 ${hcp})`:` (h${hcp})`):'');
}
function calcNet(gross, hcp){ if(gross==null||hcp==null) return null; return Math.round((gross-hcp)*10)/10; }
function _b(holes,from){ return Array.isArray(holes)&&holes.length>=18?holes.slice(from,18).reduce((a,b)=>a+(b||0),0):null; }
function cmpCountback(aScore,bScore,aH,bH){
  const d=(aScore??999)-(bScore??999); if(d!==0)return {diff:d,by:null};
  if(!aH||!bH)return {diff:0,by:null};
  for(const [from,by] of [[9,'back9'],[12,'back6'],[15,'back3'],[17,'hole18']]){ const dd=(_b(aH,from)??999)-(_b(bH,from)??999); if(dd!==0)return {diff:dd,by}; }
  return {diff:0,by:'tied'};
}
// 스테이블포드 동점 → 점수(포인트) 카운트백: 후반9 → 후반6 → 후반3 → 18번홀의 점수 합이 많은 쪽이 우선
function stablefordHolePts(holes, parsArr, pts, handicap){
  const P=(Array.isArray(parsArr)&&parsArr.length===18)?parsArr:GOLF_DEFAULT_PAR;
  const PT=stablePts(pts); const isNet=(typeof handicap==='number');
  const hcp=isNet?Math.min(36,Math.max(0,Math.floor(handicap||0))):0; const base=Math.floor(hcp/18),extra=hcp%18;
  const arr=[];
  for(let i=0;i<18;i++){ const par=P[i]||4, s=(Array.isArray(holes)?holes[i]:null);
    if(s==null||s===''){arr.push(0);continue;}
    let cat; if(+s===1)cat='hio'; else if(isNet){const net=(+s)-(base+(i<extra?1:0));const dd=net-par;cat=dd<=-3?'albatross':dd===-2?'eagle':dd===-1?'birdie':dd===0?'par':dd===1?'bogey':'dbogey';} else cat=stableCat(+s,par);
    arr.push(PT[cat]||0); }
  return arr;
}
function cmpStablefordCountback(aH,bH,parsArr,pts,aHcp,bHcp){
  if(!Array.isArray(aH)||!Array.isArray(bH)) return {diff:0,by:'tied'};
  const A=stablefordHolePts(aH,parsArr,pts,aHcp), B=stablefordHolePts(bH,parsArr,pts,bHcp);
  for(const [from,by] of [[9,'back9'],[12,'back6'],[15,'back3'],[17,'hole18']]){ const as=A.slice(from).reduce((x,y)=>x+y,0), bs=B.slice(from).reduce((x,y)=>x+y,0); if(as!==bs) return {diff:bs-as,by}; } // 점수 많은 쪽 우선
  return {diff:0,by:'tied'};
}
function methodLabel(m){ return {none:lang==='ko'?'보정 없음':lang==='th'?'ไม่ปรับ':'None',peoria:lang==='ko'?'신페리오':lang==='th'?'เปเรีย':'Peoria',stableford:lang==='ko'?'스테이블포드':lang==='th'?'สเตเบิลฟอร์ด':'Stableford',stableford_net:lang==='ko'?'스테이블포드(넷)':lang==='th'?'สเตเบิลฟอร์ด(เน็ต)':'Stableford(net)',gross:lang==='ko'?'그로스':lang==='th'?'กรอส':'Gross',net:lang==='ko'?'넷':lang==='th'?'เน็ต':'Net'}[m]||m; }

async function drawPeoria(eventId){
  const pars=(evData&&Array.isArray(evData.hole_pars)&&evData.hole_pars.length===18)?evData.hole_pars:GOLF_DEFAULT_PAR;
  // 정석 신페리오: 파3·파4·파5에서 각각 4홀씩 선정(총 12홀, 숨긴홀 par합=48 → ×1.5=72)
  const par3=[],par4=[],par5=[]; for(let i=0;i<18;i++){ const p=pars[i]; if(p===3)par3.push(i+1); else if(p===5)par5.push(i+1); else par4.push(i+1); }
  const pick=(arr,n)=>{ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.slice(0,Math.min(n,a.length)); };
  const holes=[...pick(par3,4),...pick(par4,4),...pick(par5,4)].sort((a,b)=>a-b);
  try{ const {error}=await sb.from('event_awards').update({peoria_holes:holes,updated_at:new Date().toISOString()}).eq('event_id',eventId); if(error){toast(error.message);return;} toast(lang==='ko'?'12홀 추첨 완료':lang==='th'?'สุ่มแล้ว':'Drawn'); openEvent(eventId); }catch(e){toast(String(e.message||e));}
}

function evCompute(){
  const method=evAwards?evAwards.award_method:null;
  const peoriaHoles=evAwards?evAwards.peoria_holes:null;
  const stPts=evAwards?evAwards.stableford_points:null;
  const grossRanks=evAwards?(evAwards.gross_ranks??0):0;
  const methodRanks=evAwards?(evAwards.award_ranks??0):0;
  const finalized=!!(evAwards&&evAwards.awarded_at);
  const holePars=(evData&&Array.isArray(evData.hole_pars)&&evData.hole_pars.length===18)?evData.hole_pars:null;
  const ko=lang==='ko';
  const enhanced=evParts.map(p=>{
    const e={...p,gross:p.total??null,adjusted:null,adjLabel:'',adjCalc:''};
    if(method==='peoria'&&peoriaHoles&&p.holes){ const r=calcPeoria(p.holes,peoriaHoles,holePars); if(r){e.adjusted=r.net;
      e.adjLabel=ko?`넷 ${r.net} · 핸디 ${r.handicap}`:`net ${r.net} · h ${r.handicap}`;
      e.adjCalc=ko?`숨긴 12홀 합 ${r.hidden} × 1.5 − Par ${r.coursePar} = ${Math.round((r.hidden*1.5-r.coursePar)*10)/10}, ×0.8 = 핸디 ${r.handicap}${r.capped?'(상한)':''} → 넷 ${r.gross}−${r.handicap}=${r.net}`:`(Σ12 ${r.hidden}×1.5−${r.coursePar})×0.8=h${r.handicap} → net ${r.gross}−${r.handicap}=${r.net}`; } }
    else if(method==='stableford'&&p.holes){ const pts=calcStableford(p.holes,holePars,stPts); if(pts!=null){e.adjusted=-pts;e.adjLabel=`${pts}${ko?'점':'pt'}`; e.adjCalc=stableBreakdown(p.holes,holePars,stPts,ko,null);} }
    else if(method==='stableford_net'&&p.holes){ const pts=calcStablefordNet(p.holes,holePars,p.handicap,stPts); if(pts!=null){e.adjusted=-pts;e.adjLabel=`${pts}${ko?'점(넷)':'pt(net)'}`; e.adjCalc=stableBreakdown(p.holes,holePars,stPts,ko,(p.handicap||0));} }
    else if(method==='net'&&p.total!=null&&p.handicap!=null){ const n=calcNet(p.total,p.handicap); e.adjusted=n;e.adjLabel=ko?`넷 ${n} · 핸디 ${p.handicap}`:`net ${n}`; e.adjCalc=ko?`그로스 ${p.total} − 핸디 ${p.handicap} = 넷 ${n}`:`${p.total} − ${p.handicap} = ${n}`; }
    return e;
  });
  const byGross=[...enhanced].sort((a,b)=>cmpCountback(a.gross,b.gross,a.holes,b.holes).diff);
  for(let i=1;i<byGross.length;i++){ if(byGross[i].gross!=null&&byGross[i].gross===byGross[i-1].gross){ const r=cmpCountback(byGross[i-1].gross,byGross[i].gross,byGross[i-1].holes,byGross[i].holes); if(r.by&&r.by!=='tied')byGross[i]._cb=r.by; } }
  const grossOrder=(finalized&&grossRanks>0)?byGross.slice(0,grossRanks).map(p=>p.user_id):[];
  const grossSet=new Set(grossOrder);
  const isStable=(method==='stableford'||method==='stableford_net');
  const mCmp=(a,b)=>{ if(isStable) return cmpStablefordCountback(a.holes,b.holes,holePars,stPts,method==='stableford_net'?a.handicap:null,method==='stableford_net'?b.handicap:null); return cmpCountback(a.gross,b.gross,a.holes,b.holes); };
  let methodOrder=[];
  if(finalized&&method&&method!=='gross'&&method!=='none'&&methodRanks>0){
    const eligible=enhanced.filter(p=>!grossSet.has(p.user_id)&&p.adjusted!=null);
    eligible.sort((a,b)=>(a.adjusted-b.adjusted)||mCmp(a,b).diff);
    methodOrder=eligible.slice(0,methodRanks).map(p=>p.user_id);
    // 동점 카운트백 표시: 같은 점수인데 카운트백으로 갈린 경우 표식
    for(let i=1;i<methodOrder.length;i++){ const a=enhanced.find(p=>p.user_id===methodOrder[i-1]), b=enhanced.find(p=>p.user_id===methodOrder[i]); if(a&&b&&a.adjusted===b.adjusted){ const r=mCmp(a,b); if(r.by&&r.by!=='tied') b._cb=r.by; } }
  }
  const methodSet=new Set(methodOrder);
  let displayList;
  if(!finalized){ displayList=byGross; }
  else { const gw=byGross.filter(p=>grossSet.has(p.user_id));
    const mw=methodOrder.map(uid=>enhanced.find(p=>p.user_id===uid)).filter(Boolean);
    const rest=byGross.filter(p=>!grossSet.has(p.user_id)&&!methodSet.has(p.user_id));
    displayList=[...gw,...mw,...rest]; }
  return {displayList,grossOrder,methodOrder,method,finalized};
}

    else if(st==='pending') btn=`<button class="join" disabled style="background:#cbd5e1;cursor:default">${lang==='ko'?'승인 대기':lang==='th'?'รออนุมัติ':'Pending'}</button>`;
    else if(st==='rejected') btn=`<button class="join" disabled style="background:#e5e7eb;color:#9ca3af;cursor:default">${lang==='ko'?'거절됨':lang==='th'?'ปฏิเสธแล้ว':'Rejected'}</button>`;
    else btn=`<button class="join" data-clubapply="${c.id}">${lang==='ko'?'가입 신청':lang==='th'?'สมัคร':'Apply'}</button>`;
    const left=pend?`<span class="flag" style="color:#b45309;background:#fff7e8;border-color:#ffe6b3">⏳ ${lang==='ko'?'관리자 승인 대기중':lang==='th'?'รอแอดมินอนุมัติ':'Awaiting approval'}</span>`:(st==='leader'?`<span class="flag">👑 ${lang==='ko'?'방장':lang==='th'?'หัวหน้า':'Leader'}</span>`:(st==='vice'?`<span class="flag" style="color:#2f6df0;background:#eef4ff;border-color:#cfe0ff">⭐ ${lang==='ko'?'부방장':lang==='th'?'รองหัวหน้า':'Vice'}</span>`:(c.region?`<span>📍 ${escT(c.region)}</span>`:`<span>⛳ ${lang==='ko'?'동호회':lang==='th'?'ชมรม':'Club'}</span>`)));

  return back+`<h2 class="sech" style="margin:6px 0 10px">⛳ ${lang==='ko'?'골프 동호회':lang==='th'?'ชมรมกอล์ฟ':'Golf clubs'}</h2>`+adminSec+createUI+note+clubCards;

async function delPost(id){
  if(!window.confirm(lang==='ko'?'이 글을 삭제할까요? 되돌릴 수 없습니다.':lang==='th'?'ลบโพสต์นี้? ย้อนกลับไม่ได้':'Delete this post? Cannot be undone.')) return;
  try{
    const {data,error}=await sb.from('posts').delete().eq('id',id).select('id');
    if(error){ toast(error.message); return; }
    if(!data||!data.length){ toast(lang==='ko'?'삭제 권한이 없어요 (작성자/관리자만)':lang==='th'?'ไม่มีสิทธิ์ลบ':'No permission (author/admin only)'); return; }
    postOpen=null; toast(lang==='ko'?'삭제했어요':lang==='th'?'ลบแล้ว':'Deleted'); loadPosts(); render(); page.scrollTo(0,0);
  }catch(e){ toast(String(e.message||e)); }
}
async function togglePostPin(id){
  const p=info.find(x=>x.id===id); if(!p) return;
  const nv=!p.pinned;
  try{
    const {data,error}=await sb.from('posts').update({pinned:nv}).eq('id',id).select('id');
    if(error){ toast(/pinned/.test(error.message)?(lang==='ko'?'고정 기능 준비중 (DB 컬럼 필요)':'Pin column missing'):error.message); return; }
    if(!data||!data.length){ toast(lang==='ko'?'고정 권한이 없어요 (작성자/관리자만)':lang==='th'?'ไม่มีสิทธิ์':'No permission (author/admin only)'); return; }
    p.pinned=nv; toast(nv?(lang==='ko'?'상단에 고정했어요':lang==='th'?'ปักหมุดแล้ว':'Pinned to top'):(lang==='ko'?'고정을 해제했어요':lang==='th'?'เลิกปักหมุดแล้ว':'Unpinned'));
    loadPosts(); render();
  }catch(e){ toast(String(e.message||e)); }
}

function renderNav(){
  const items=[["shop","🏬","nav_shop"],["market","🛍️","nav_market"],["jobs","💼","nav_jobs"],["chat","💬","nav_chat"],["community","🏘️","nav_community"],["me","👤","nav_me"]];
  const unread=authed?chats.reduce((s,c)=>s+(c.unread||0),0):0;  // 실제 안읽음 (로그인 시에만)
  navEl.innerHTML=items.map(([k,ic,key])=>`
    <button data-tab="${k}" class="${tab===k?'on':''}">
      <span class="ic">${ic}</span><span>${L()[key]}</span>
      ${k==='chat'&&unread?`<span class="ndot">${unread}</span>`:''}
    </button>`).join('');
}
function renderFab(){
  const hide=(tab==='home')||(tab==='chat')||(tab==='me')||(tab==='shop'&&storeOpen)||(tab==='community'&&commSeg==='clubs')||(tab==='market'&&listingOpen);
  if(hide){fab.style.display='none';return;}
  fab.style.display='flex';
  let lbl=L().fab_market;
  if(tab==='shop')lbl=L().fab_shop; else if(tab==='jobs')lbl=L().fab_jobs; else if(tab==='community')lbl=L().fab_info;
  fab.innerHTML=`✏️ ${lbl}`;
}

function saveNav(){ try{ if(screen!=='app')return; sessionStorage.setItem('tmNav', JSON.stringify({
  tab:tab, shopCat:shopCat, storeOpen:storeOpen, mseg:mseg, listingOpen:listingOpen, mktSubFilter:mktSubFilter,
  jseg:jseg, jobCatFilter:jobCatFilter, commSeg:commSeg, golfOpen:!!golfOpen, golfSub:golfSub,
  clubOpen:clubOpen, evOpen:evOpen, golfMatchOpen:(typeof golfMatchOpen!=='undefined'?golfMatchOpen:null),
  myStores:!!myStores, myClubsOpen:!!myClubsOpen })); }catch(e){} }
function restoreNav(){ try{ var s=JSON.parse(sessionStorage.getItem('tmNav')||'null'); if(!s)return;
  if(s.tab) tab=s.tab; if(s.shopCat) shopCat=s.shopCat; if(s.storeOpen) storeOpen=s.storeOpen;
  if(s.mseg) mseg=s.mseg; if(s.listingOpen) listingOpen=s.listingOpen; if(s.mktSubFilter) mktSubFilter=s.mktSubFilter;
  if(s.jseg) jseg=s.jseg; if(s.jobCatFilter) jobCatFilter=s.jobCatFilter; if(s.commSeg) commSeg=s.commSeg;
  golfOpen=!!s.golfOpen; if(s.golfSub) golfSub=s.golfSub;
  myStores=!!s.myStores; myClubsOpen=!!s.myClubsOpen;

  if(s.clubOpen){ try{ openClub(s.clubOpen); if(s.evOpen) setTimeout(function(){ try{ openEvent(s.evOpen); }catch(e){} },300); }catch(e){} }
}catch(e){} }
function render(){
  if(screen==='gate'){
    gateEl.style.display='flex'; topEl.style.display='none'; page.style.display='none'; fab.style.display='none'; navEl.style.display='none';
    renderGate(); renderPicker(); renderPay(); renderGmGate(); renderGmFrame(); renderVerify(); return;
  }
  gateEl.style.display='none'; topEl.style.display=''; page.style.display=''; navEl.style.display='';
  renderTop(); renderNav(); renderFab();
  if(tab==='home') viewHome();
  else if(tab==='shop') storeOpen?viewStore():viewShop();
  else if(tab==='market') listingOpen?viewListingDetail():viewMarket();
  else if(tab==='jobs') viewJobs();
  else if(tab==='chat') chatOpen!==null?viewChatDetail():viewChatList();
  else if(tab==='community') viewCommunity();
  else if(tab==='me') viewMe();
  renderPicker(); renderPay(); renderGmGate(); renderGmFrame(); renderVerify(); renderWrite(); renderReport(); renderReview(); renderFsView();
  saveNav();
  try{ if(window.__syncTrap) window.__syncTrap(); }catch(e){}   // 깊어진 화면이면 뒤로가기 트랩 미리 적재
}

/* ===================== events ===================== */
document.addEventListener('change', async e=>{
  const isMenu=e.target&&e.target.matches&&e.target.matches('[data-mphoto]');
  const isQr=e.target&&e.target.matches&&e.target.matches('[data-payqr]');
  const isLogo=e.target&&e.target.matches&&e.target.matches('[data-storelogo]');
  const isPhoto=e.target&&e.target.matches&&e.target.matches('[data-storephoto]');
  const isPromo=e.target&&e.target.matches&&e.target.matches('[data-promophoto]');
  const isIntro=e.target&&e.target.matches&&e.target.matches('[data-introphoto]');
  const isWpost=e.target&&e.target.matches&&e.target.matches('[data-wphoto]');
  if(!isMenu&&!isQr&&!isLogo&&!isPhoto&&!isPromo&&!isIntro&&!isWpost) return;
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const mi=isMenu?+e.target.dataset.mphoto:-1;
  if(isMenu&&(!wStore.menu||!wStore.menu[mi])) return;
  if(!uid){toast(L().v_need_login);return;}
  toast(lang==='ko'?'사진 업로드 중…':lang==='th'?'กำลังอัปโหลด…':'Uploading…');
  try{
    const ext=((file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg');
    const pre=isQr?'qr_':isLogo?'logo_':isPhoto?'photo_':isPromo?'promo_':isIntro?'intro_':isWpost?'post_':'m_';
    const path=uid+'/'+pre+Date.now()+(isMenu?('_'+mi):'')+'.'+ext;
    const up=await sb.storage.from('store-photos').upload(path,file,{upsert:true,contentType:file.type});
    if(up.error){toast(up.error.message);return;}
    const url=sb.storage.from('store-photos').getPublicUrl(path).data.publicUrl;
    if(isWpost){ wPhotos.push(url); renderWrite(); return; }
    snapStore();
    if(isQr) wStore.payQr=url; else if(isLogo) wStore.logo=url; else if(isPromo) wStore.promoPhoto=url; else if(isIntro) wStore.introPhoto=url; else if(isPhoto){ wStore.photos=wStore.photos||[]; wStore.photos.push(url); } else wStore.menu[mi].photo=url;
    renderWrite();
  }catch(err){ toast(String(err.message||err)); }
});
