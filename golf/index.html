<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2E7D32">
  <meta name="description" content="GolfMate — 편하고 스마트한 골프 플랫폼 / Smart Golf Platform for Everyone">
  <title>GolfMate</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B3%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <div id="boot">
      <div class="boot-emoji">⛳</div>
      <div class="boot-text">GolfMate 로딩 중...</div>
      <div class="boot-hint">5초 이상 멈추면 주소 끝에 <code>?reset=1</code> 을 붙여보세요</div>
    </div>
  </div>
  <div id="toast-container"></div>
  <div id="dialog-container"></div>
  <div id="loading-overlay" style="display:none;">
    <div class="spinner"></div>
  </div>

  <script type="module" src="./js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW register fail', e));
      });
    }
    if (new URLSearchParams(location.search).get('reset') === '1') {
      (async () => {
        try { localStorage.clear(); sessionStorage.clear(); } catch(_){}
        try { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) await r.unregister(); } catch(_){}
        try { const keys = await caches.keys(); for (const k of keys) await caches.delete(k); } catch(_){}
        location.replace('/');
      })();
    }
  </script>

  <script>
    // In-app browser warning (LINE, KakaoTalk, FB, Instagram) — these break PWA/auth
    (function(){
      const ua = navigator.userAgent.toLowerCase();
      const isInAppBrowser = /line|kakao|fb_iab|fban|fbav|instagram/i.test(ua);
      if (!isInAppBrowser) return;
      const isLine = ua.includes('line/');
      const isKakao = ua.includes('kakaotalk');
      const isAndroid = /android/.test(ua);
      const isIos = /iphone|ipad|ipod/.test(ua);
      const intentUrl = 'intent://' + location.host + location.pathname + location.search + location.hash + '#Intent;scheme=https;package=com.android.chrome;end';
      const safariUrl = 'x-safari-' + location.href;
      const chromeUrl = 'googlechrome://' + location.host + location.pathname + location.search + location.hash;
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:#1a1a2e;color:white;z-index:99999;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-family:-apple-system,sans-serif;';
      overlay.innerHTML = '<div style="font-size:48px;margin-bottom:12px;">⚠️</div>' +
        '<h1 style="font-size:20px;margin:0 0 12px;color:#FFB300;">' + (isLine ? '라인' : (isKakao ? '카카오톡' : '인앱')) + ' 브라우저에서는 정상 동작 안 합니다</h1>' +
        '<p style="font-size:14px;line-height:1.6;margin:0 0 20px;opacity:0.85;">' +
          '로그인·PWA 설치 등이 제대로 작동하려면<br><b style="color:#FFB300;">외부 브라우저(Chrome/Safari)</b>로 열어주세요.' +
        '</p>' +
        (isAndroid ? '<a href="' + intentUrl + '" style="background:#4285F4;color:white;padding:14px 28px;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;margin-bottom:12px;">🌐 Chrome으로 열기</a>' : '') +
        (isIos ? '<div style="background:white;color:#1a1a2e;padding:16px;border-radius:8px;max-width:300px;font-size:13px;line-height:1.8;">우상단 <b>⋯</b> 메뉴 →<br><b>Safari에서 열기</b> 선택</div>' : '') +
        '<button onclick="document.body.removeChild(this.parentElement)" style="background:transparent;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.3);padding:8px 16px;border-radius:6px;margin-top:20px;font-size:12px;cursor:pointer;">그래도 계속 (권장하지 않음)</button>';
      document.body.appendChild(overlay);
    })();
  </script>
</body>
</html>
