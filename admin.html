<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThaiMate Admin — 관리자 콘솔</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1a1d22; --sub:#7b828c; --line:#e8eaee;
    --pri:#ff7a33; --pri-soft:#fff1e8; --blue:#2f6df0; --green:#15a05a; --amber:#e3920b; --red:#e4453a;
    --side:#1b1d22; --side-sub:#9aa0ab;
    --shadow:0 1px 2px rgba(20,24,30,.05),0 6px 18px rgba(20,24,30,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif}
  .wrap{display:flex;min-height:100vh}
  /* sidebar */
  .side{width:218px;flex:0 0 218px;background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:18px 18px 14px;font-weight:800;font-size:16px}
  .brand .lg{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pri),#ffa869);display:grid;place-items:center;font-weight:900;font-size:16px}
  .brand small{display:block;font-size:10.5px;color:var(--side-sub);font-weight:600;margin-top:1px}
  .nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
  .nav button{display:flex;align-items:center;gap:11px;border:none;background:transparent;color:var(--side-sub);font-size:13.5px;font-weight:700;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left}
  .nav button .ic{font-size:16px;width:18px;text-align:center}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.on{background:var(--pri);color:#fff}
  .nav .badge-n{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
  .side .foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--side-sub)}
  .side .foot a{color:#ffb98a;text-decoration:none;font-weight:700}
  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}
  .topbar .date{font-size:12.5px;color:var(--sub);font-weight:600}
  .topbar .sp{flex:1}
  .topbar .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:p 1.6s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(21,160,90,.5)}70%{box-shadow:0 0 0 7px rgba(21,160,90,0)}100%{box-shadow:0 0 0 0 rgba(21,160,90,0)}}
  .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--pri),#ffa869);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
  .content{padding:22px 24px 40px}
  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 15px 16px;box-shadow:var(--shadow)}
  .kpi .k-h{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);font-weight:700}
  .kpi .k-v{font-size:23px;font-weight:900;letter-spacing:-.5px;margin-top:9px}
  .kpi .k-d{font-size:11.5px;font-weight:700;margin-top:5px}
  .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--sub)}
  /* panels */
  .grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .panel .p-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .panel .p-h b{font-size:14px;font-weight:800}
  .panel .p-h .more{margin-left:auto;font-size:12px;color:var(--pri);font-weight:700;cursor:pointer;border:none;background:none}
  .p-body{padding:14px 16px}
  /* bar chart */
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:6px 2px 0}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .bar .col{width:60%;max-width:34px;background:linear-gradient(180deg,#ffb588,var(--pri));border-radius:7px 7px 3px 3px}
  .bar .col.hi{background:linear-gradient(180deg,#ff9a5e,#e95f12)}
  .bar .lb{font-size:10.5px;color:var(--sub);font-weight:700}
  .bar .vl{font-size:10.5px;color:var(--ink);font-weight:800}
  /* region bars */
  .rrow{display:flex;align-items:center;gap:10px;margin:11px 0}
  .rrow .rn{width:60px;font-size:12.5px;font-weight:700}
  .rrow .rt{flex:1;height:9px;border-radius:999px;background:#eef0f3;overflow:hidden}
  .rrow .rt i{display:block;height:100%;border-radius:999px}
  .rrow .rv{width:42px;text-align:right;font-size:12px;font-weight:800;color:var(--sub)}
  /* feed */
  .feed{display:flex;flex-direction:column}
  .fitem{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f1f2f4}
  .fitem:last-child{border-bottom:none}
  .fic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;font-size:14px}
  .fitem .ft{font-size:13px;line-height:1.4}
  .fitem .fm{font-size:11px;color:var(--sub);margin-top:2px}
  /* table */
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
  .tbl td{padding:12px 14px;border-bottom:1px solid #f1f2f4;white-space:nowrap}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:hover td{background:#fcfcfd}
  .tbl .mono{font-weight:800;color:#4b5563}
  .badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;display:inline-block}
  .b-green{background:#e7f7ee;color:var(--green)} .b-amber{background:#fdf3e0;color:var(--amber)}
  .b-red{background:#fde9e7;color:var(--red)} .b-blue{background:#eaf2ff;color:var(--blue)} .b-gray{background:#eef0f3;color:var(--sub)}
  .vchk{color:var(--green);font-weight:800}
  .act{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:11.5px;font-weight:700;color:#4b5563;padding:6px 10px;cursor:pointer;margin-right:5px}
  .act.pri{background:var(--pri);border-color:var(--pri);color:#fff}
  .act.danger{color:var(--red);border-color:#f6c9c4}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--sub);padding:8px 14px;cursor:pointer}
  .filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .scroll{overflow-x:auto}
  .sec-sub{font-size:12.5px;color:var(--sub);margin:-6px 0 16px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1a1d22;color:#fff;font-size:13px;font-weight:600;padding:12px 18px;border-radius:11px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.show{opacity:1}
  /* analytics & monetization */
  .phase{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fafbfc}
  .phase.cur{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 6px 18px rgba(255,122,51,.12)}
  .phase h4{margin:0;font-size:13.5px;font-weight:800}
  .phase p{margin:6px 0 9px;font-size:11.5px;color:var(--sub);line-height:1.55}
  .modesw{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .modesw button{flex:1;min-width:130px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;cursor:pointer;text-align:left}
  .modesw button.on{border-color:var(--pri);background:var(--pri-soft)}
  .modesw .mt{font-size:13.5px;font-weight:800}
  .modesw .md{font-size:11px;color:var(--sub);margin-top:3px}
  .modesw button.on .md{color:#b9620f}
  .rate{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .rate .rl{font-size:12.5px;font-weight:700;color:var(--sub);margin-right:2px}
  .rate .rc{border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--sub);padding:8px 13px;cursor:pointer}
  .rate .rc.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .prog{margin:13px 0}
  .prog .ph{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px}
  .prog .ph span.sub{color:var(--sub);font-weight:600}
  .prog .pb{height:10px;border-radius:999px;background:#eef0f3;overflow:hidden}
  .prog .pb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffce9a,var(--pri))}
  .prog .pb i.done{background:linear-gradient(90deg,#7fe0a8,var(--green))}
  .tbl tfoot td{font-weight:800;background:#f7f8fa;border-top:2px solid var(--line);border-bottom:none}
  .cmp{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  .cmp .cc{border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
  .cmp .cc.on{border-color:var(--pri);background:var(--pri-soft)}
  .cmp .cl{font-size:12px;color:var(--sub);font-weight:700}
  .cmp .cv{font-size:18px;font-weight:900;margin-top:6px;letter-spacing:-.4px}
  /* modal (invoice) */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  .modal.show{display:flex}
  .mscrim{position:absolute;inset:0;background:rgba(18,20,24,.5)}
  .msheet{position:relative;background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .mclose{position:absolute;right:14px;top:14px;border:none;background:#f0f1f4;width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer;z-index:2}
  /* cohort heatmap */
  .cohort{border-collapse:separate;border-spacing:4px;font-size:12.5px;min-width:540px}
  .cohort th{font-size:11px;color:var(--sub);font-weight:700;padding:6px 4px}
  .cohort td{text-align:center;padding:11px 6px;border-radius:8px;font-weight:800;min-width:54px}
  .cohort td.lbl{text-align:left;background:#fafbfc;color:var(--ink);font-weight:700;white-space:nowrap}
  /* funnel */
  .funnel .fn{display:flex;align-items:center;gap:12px;margin:9px 0}
  .funnel .fn .fl{width:118px;font-size:12.5px;font-weight:700}
  .funnel .fn .fbar{height:30px;border-radius:8px;background:linear-gradient(90deg,#e95f12,#ffb588);display:flex;align-items:center;padding:0 11px;color:#fff;font-weight:800;font-size:12px;min-width:60px}
  .funnel .fn .fv{width:64px;text-align:right;font-size:12px;color:var(--green);font-weight:800}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.cmp{grid-template-columns:repeat(2,1fr)}.side{width:64px;flex-basis:64px}.brand span.tx,.nav button span.lbl,.side .foot{display:none}.nav button{justify-content:center}}
</style>
</head>

async function adminDelClub(id,btn){
  const c=CLUBS.find(x=>x.id===id); const nm=c?c.name:'';
  if(!confirm('모임 "'+nm+'" 을(를) 삭제할까요?\n소속 멤버·활동·공지도 함께 삭제되며 되돌릴 수 없습니다.')) return;
  if(btn){btn.disabled=true;btn.textContent='삭제중…';}
  const {error}=await sb.from('clubs').delete().eq('id',id);
  if(error){ toast('삭제 실패: '+error.message); if(btn){btn.disabled=false;btn.textContent='삭제';} return; }
  CLUBS=CLUBS.filter(x=>x.id!==id); ACTS=ACTS.filter(a=>a.club_id!==id);
  toast('모임 "'+nm+'" 삭제됨'); render();
}
async function adminDelAct(id,btn){
  const a=ACTS.find(x=>x.id===id); const nm=a?a.title:'';
  if(!confirm('활동 "'+nm+'" 을(를) 삭제할까요? 되돌릴 수 없습니다.')) return;
  if(btn){btn.disabled=true;btn.textContent='삭제중…';}
  const {error}=await sb.from('club_activities').delete().eq('id',id);
  if(error){ toast('삭제 실패: '+error.message); if(btn){btn.disabled=false;btn.textContent='삭제';} return; }
  ACTS=ACTS.filter(x=>x.id!==id);
  toast('활동 "'+nm+'" 삭제됨'); render();
}

   <tfoot><tr><td>합계</td><td></td><td class="mono">${fmt(gmvT)}</td><td>${fmt(T('comm'))}</td><td>${fmt(T('ad'))}</td><td>${fmt(T('sub'))}</td><td>${fmt(T('vat'))}</td><td style="color:var(--pri)">${fmt(T('total'))}</td><td></td><td></td></tr></tfoot>
   </table></div></div>`;
}
/* ===== ② 광고 상품 ===== */

  const sold=AD_PRODUCTS.reduce((a,p)=>a+p.sold,0);
  const soldOut=AD_PRODUCTS.filter(p=>typeof p.cap==='number'&&p.sold>=p.cap).length;
  return `<p class="sec-sub">광고 상품 카탈로그와 판매현황. <b>정액 광고료가 2단계 핵심 수익원</b>입니다.</p>

     <div class="kpi"><div class="k-h">💰 주간 광고매출</div><div class="k-v" style="color:var(--pri)">${fmt(wkRev)}</div><div class="k-d up">판매 ${sold}건</div></div>
     <div class="kpi"><div class="k-h">🟢 집행중 캠페인</div><div class="k-v">${AD_CAMP.filter(c=>c[4]==='집행중').length}건</div><div class="k-d flat">현재 노출중</div></div>
     <div class="kpi"><div class="k-h">🔴 매진 상품</div><div class="k-v">${soldOut}종</div><div class="k-d flat">재고 소진</div></div>
   </div>
   <div class="panel" style="margin-bottom:18px"><div class="p-h"><b>📦 광고 상품 단가표</b></div>
   <div class="scroll"><table class="tbl"><thead><tr><th>상품</th><th>노출 위치</th><th>단가</th><th>판매/재고</th><th>주간 매출</th><th>상태</th><th>관리</th></tr></thead>
   <tbody>${AD_PRODUCTS.map(p=>{const full=typeof p.cap==='number'&&p.sold>=p.cap;const st=full?'매진':(typeof p.cap==='number'&&p.sold>=p.cap-1?'마감임박':'판매중');return `<tr><td><b>${p.n}</b></td><td>${p.loc}</td><td class="mono">${fmt(p.price)}/${p.unit}</td><td>${p.sold}${typeof p.cap==='number'?` / ${p.cap}`:(p.cap==='∞'?' <span style="color:var(--sub)">/ 무제한</span>':'')}</td><td class="mono">${fmt(p.price*p.sold)}</td><td>${badge(st)}</td><td><button class="act" onclick="toast('${p.n} 단가·재고 수정')">수정</button></td></tr>`;}).join('')}</tbody></table></div></div>
   <div class="panel"><div class="p-h"><b>🟢 집행중 캠페인</b></div>
   <div class="scroll"><table class="tbl"><thead><tr><th>광고주</th><th>상품</th><th>기간</th><th>금액</th><th>상태</th><th>관리</th></tr></thead>
   <tbody>${AD_CAMP.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td class="mono">${c[3]}</td><td>${badge(c[4])}</td><td><button class="act" onclick="toast('${c[0]} 캠페인 상세')">상세</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
/* ===== ③ 코호트·리텐션 ===== */
function heat(v){if(v==null)return 'background:#f4f5f7;color:#c9ccd2';const t=v/100;return `background:rgba(255,122,51,${(0.14+t*0.82).toFixed(2)});color:${t>0.5?'#fff':'#7a3a12'}`;}
function secCohort(){
  const maxF=FUNNEL[0][1];
  return `<p class="sec-sub">가입 코호트별 잔존율·동네 리텐션·전환 퍼널. <b>어느 동네·분류가 돈이 되는지</b> 체계적으로 봅니다.</p>
   <div class="panel" style="margin-bottom:18px"><div class="p-h"><b>🔁 가입월별 리텐션 코호트</b><span style="font-size:11.5px;color:var(--sub)">색이 진할수록 잔존율 높음 (M=가입 후 개월)</span></div>
   <div class="p-body scroll"><table class="cohort"><thead><tr><th class="lbl">가입월</th><th>신규</th><th>M0</th><th>M1</th><th>M2</th><th>M3</th><th>M4</th></tr></thead>
   <tbody>${COHORT.map(c=>`<tr><td class="lbl">${c.m}</td><td class="lbl" style="text-align:center;background:#fff">${c.size.toLocaleString()}</td>${c.ret.map(v=>`<td style="${heat(v)}">${v==null?'·':v+'%'}</td>`).join('')}</tr>`).join('')}</tbody></table>
   <div style="font-size:11.5px;color:var(--sub);margin-top:12px;line-height:1.6">4월 코호트 M1 <b>61%</b> — GPS 동네인증 도입 후 초기 리텐션 개선. 인증 사용자 재방문률이 미인증의 약 1.7배.</div></div></div>
   <div class="grid2">
     <div class="panel"><div class="p-h"><b>📍 동네별 30일 리텐션</b></div><div class="p-body">${HOOD_RET.map(([n,v])=>`<div class="rrow"><span class="rn" style="width:78px">${n}</span><span class="rt"><i style="width:${v*2}%;background:${v>=42?'var(--green)':'var(--pri)'}"></i></span><span class="rv">${v}%</span></div>`).join('')}<div style="font-size:11.5px;color:var(--sub);margin-top:11px;line-height:1.5">통러·님만 = 교민 밀집 동네 → 리텐션 최고. <b>동네 밀도가 리텐션을 만든다.</b></div></div></div>
     <div class="panel"><div class="p-h"><b>🧭 가입→재거래 전환 퍼널</b></div><div class="p-body funnel">${FUNNEL.map(f=>`<div class="fn"><div class="fl">${f[0]}</div><div class="fbar" style="width:${Math.max(16,Math.round(f[1]/maxF*100))}%">${f[1].toLocaleString()}</div><div class="fv">${f[2]?'▼ '+f[2]:''}</div></div>`).join('')}<div style="font-size:11.5px;color:var(--sub);margin-top:9px;line-height:1.5">가입(15%)이 최대 누수 구간. 동네인증 통과자의 첫거래·재거래 전환은 매우 높음(63%/82%).</div></div></div>
   </div>
   <div class="panel" style="margin-top:16px"><div class="p-h"><b>💡 분류별 수익성 인사이트</b></div><div class="p-body" style="font-size:13px;line-height:1.8;color:#4b5563">
     · <b>마트·식당</b> = 생활밀착 고빈도 → 재거래 견인 (LTV 핵심)<br>
     · <b>여행사</b> = 저빈도·고객단가(GMV ฿940k/64건) → 수수료 절대액 최대<br>
     · <b>뷰티·서비스</b> = 예약형, 단가 중간 → 광고 반응 우수(CTR↑)<br>
     · 권고: <b>수수료는 마트·식당(고빈도)</b>, <b>광고는 여행사·뷰티(고단가)</b>에 차등 적용</div></div>`;
}

const SECT={dash:['대시보드','오늘의 운영 현황을 한눈에',secDash],rev:['분석·수익화','거래액 분석과 수수료 시뮬레이션',secAnalytics],settle:['정산·인보이스','월별 수수료/광고비 정산서 발행',secSettle],cohort:['코호트·리텐션','가입 코호트·동네 리텐션·전환 분석',secCohort],orders:['주문 관리','식당·마트 주문 모니터링',secOrders],
 bookings:['예약 관리','서비스·여행 예약 현황',secBookings],deals:['직거래 모니터링','장터·나눔·구인 개인 거래',secDeals],
 biz:['업체·광고','교민 업체 등록 및 광고 관리',secBiz],ads:['광고 상품','광고 상품·단가·캠페인 관리',secAds],members:['회원 관리','신뢰도·인증·신고 관리',secMembers],clubmgr:['모임·활동 관리','모든 모임·활동 조회 및 삭제 (슈퍼관리자)',secClubMgr],tickets:['문의·신고','관리자 문의함 및 신고 접수',secTickets]};

/* ============ 실데이터 연결 (공개 테이블 — anon 키. 주문·예약·신고는 RLS 보호로 관리자 로그인 필요) ============ */
const CATNM={restaurant:'식당',cafe:'카페·베이커리',mart:'마트·식자재',beauty:'뷰티·헬스',service:'생활서비스',etc:'기타업종'};
const TYNM={sell:'장터',buy:'장터',give:'나눔',hire:'구인',seek:'구직'};
const STNM={selling:'거래중',reserved:'예약중',done:'완료'};
async function loadAdminData(){
  try{
    const [nb,pf,st,ls,ps,cl]=await Promise.all([
      sb.from('neighborhoods').select('id,name_ko'),
      sb.from('profiles').select('id,username,nickname,hood_id,hood_verified,email_verified,manner_temp').limit(300),
      sb.from('stores').select('id,name,category,hood_id,ad_tier,rating').order('ad_priority',{ascending:false}),
      sb.from('listings').select('id,kind,title,status,hood_id,author_id,created_at').order('created_at',{ascending:false}).limit(300),
      sb.from('posts').select('id').limit(1000),
      sb.from('clubs').select('id,name,category,leader_id,created_at').order('created_at',{ascending:false})
    ]);
    const hn={}; (nb.data||[]).forEach(n=>hn[n.id]=n.name_ko);
    if(Array.isArray(pf.data)) MEMBERS=pf.data.map(p=>[p.nickname||p.username||'-', hn[p.hood_id]||'-', !!(p.email_verified||p.hood_verified), (p.manner_temp||36.5)+'°C', '-', '0', '정상', p.id]);
    if(Array.isArray(st.data)) BIZ=st.data.map(s=>[s.name||'-', CATNM[s.category]||s.category||'기타업종', hn[s.hood_id]||'-', s.ad_tier?'노출중':'-', s.ad_tier?'฿—':'-', (+(s.rating||5)).toFixed(1), '정상', s.id]);
    let nameMap={}; const aIds=[...new Set((ls.data||[]).map(l=>l.author_id).filter(Boolean))];
    if(aIds.length){ const {data:au}=await sb.from('profiles').select('id,username,nickname').in('id',aIds); (au||[]).forEach(a=>nameMap[a.id]=a.nickname||a.username); }
    if(Array.isArray(ls.data)) DEALS=ls.data.map(l=>['L-'+String(l.id).slice(0,4), TYNM[l.kind]||'장터', l.title||'-', nameMap[l.author_id]||'-', '-', hn[l.hood_id]||'-', l.kind==='buy'?'매칭':(STNM[l.status]||'거래중'), false, l.id]);
    // 모임·활동 (슈퍼관리자 삭제 대상)
    const clubNm={}; (cl.data||[]).forEach(c=>clubNm[c.id]=c.name);
    const lIds=[...new Set((cl.data||[]).map(c=>c.leader_id).filter(Boolean))];
    let lname={}; if(lIds.length){ try{ const {data:lu}=await sb.from('profiles').select('id,username,nickname').in('id',lIds); (lu||[]).forEach(u=>lname[u.id]=u.nickname||u.username); }catch(e){} }
    CLUBS=(cl.data||[]).map(c=>({id:c.id,name:c.name,category:c.category,leader:lname[c.leader_id]||'-',created_at:c.created_at}));
    try{ const {data:ad}=await sb.from('club_activities').select('id,club_id,title,created_at').order('created_at',{ascending:false}).limit(300);
      ACTS=(ad||[]).map(a=>({id:a.id,title:a.title,club_id:a.club_id,club:clubNm[a.club_id]||'-',created_at:a.created_at})); }catch(e){ ACTS=[]; }
    const memC=(pf.data||[]).length, lsC=(ls.data||[]).length, bizC=(st.data||[]).length, psC=(ps.data||[]).length, verC=(pf.data||[]).filter(p=>p.email_verified).length, adC=(st.data||[]).filter(s=>s.ad_tier).length;
    // 보호 테이블 (관리자 권한) — 주문·예약·신고
    let ordC='—', repC='—';
    try{
      const [or,bk,rp]=await Promise.all([
        sb.from('orders').select('id,total,status,created_at,store_id,customer_id').order('created_at',{ascending:false}).limit(200),
        sb.from('bookings').select('id,detail,status,created_at,store_id,customer_id').order('created_at',{ascending:false}).limit(200),
        sb.from('reports').select('id,reason,context,status,created_at,reporter_id').order('created_at',{ascending:false}).limit(200)
      ]);
      const stMap={}; (st.data||[]).forEach(s=>stMap[s.id]={nm:s.name,cat:CATNM[s.category]||s.category,hood:hn[s.hood_id]||'-'});
      const cIds=[...new Set([...(or.data||[]).map(o=>o.customer_id),...(bk.data||[]).map(b=>b.customer_id),...(rp.data||[]).map(r=>r.reporter_id)].filter(Boolean))];
      let cn={}; if(cIds.length){ const {data:cu}=await sb.from('profiles').select('id,username,nickname').in('id',cIds); (cu||[]).forEach(c=>cn[c.id]=c.nickname||c.username); }
      const OSTAT={placed:'결제대기',preparing:'조리중',delivering:'배달중',done:'완료',canceled:'취소'}, RSTAT={open:'미처리',reviewing:'처리중',closed:'답변완료'};
      if(Array.isArray(or.data)){ ordC=or.data.length; ORDERS=or.data.map(o=>{const s=stMap[o.store_id]||{};return ['#'+String(o.id).slice(0,5), s.nm||'-', s.cat||'-', cn[o.customer_id]||'-', s.hood||'-', '฿'+(+(o.total||0)).toLocaleString(), o.status==='canceled'?'취소':'완료', OSTAT[o.status]||o.status, (o.created_at||'').slice(11,16)];}); }
      if(Array.isArray(bk.data)){ BOOKINGS=bk.data.map(b=>{const s=stMap[b.store_id]||{};return ['B-'+String(b.id).slice(0,4), s.nm||'-', s.cat||'-', cn[b.customer_id]||'-', b.detail||'-', b.status==='confirmed'?'확정':(b.status==='canceled'?'취소':'대기')];}); }
      if(Array.isArray(rp.data)){ repC=rp.data.filter(r=>r.status==='open').length; TICKETS=rp.data.map(r=>['R-'+String(r.id).slice(0,4), '신고', cn[r.reporter_id]||'-', r.reason||r.context||'-', RSTAT[r.status]||'미처리', (r.created_at||'').slice(5,16).replace('T',' ')]); }
    }catch(e){}
    KPI=[
      {h:'총 회원',v:memC+'명',d:'이메일 인증 '+verC+'명',c:'up',i:'👥'},
      {h:'등록 매물·구인',v:lsC+'건',d:'장터·나눔·구인구직',c:'flat',i:'🛒'},
      {h:'등록 업체',v:bizC+'곳',d:'광고 '+adC+'곳',c:'flat',i:'🏪'},
      {h:'소식 게시물',v:psC+'건',d:'정보·공지',c:'flat',i:'📰'},
      {h:'주문',v:ordC+'건',d:'앱 내 직거래 주문',c:'flat',i:'🧾'},
      {h:'미처리 신고',v:repC+'건',d:'문의·신고함',c:(+repC>0?'down':'flat'),i:'⚠️'}
    ];
    render();
  }catch(e){}
}
async function unlockConsole(){ document.getElementById('adminLogin').style.display='none'; loadAdminData(); }
(async()=>{ try{ const {data}=await sb.auth.getSession(); if(data.session){ const {data:isA}=await sb.rpc('is_admin'); if(isA){ unlockConsole(); } } }catch(e){} })();
document.getElementById('alBtn').addEventListener('click', async()=>{
  let em=document.getElementById('alEmail').value.trim();
  if(em && em.indexOf('@')<0) em=em.toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@thaimate.app';  // 아이디 → 내부 이메일
  const pw=document.getElementById('alPw').value, msg=document.getElementById('alMsg');
  msg.style.color='#888'; msg.textContent='확인 중…';
  const si=await sb.auth.signInWithPassword({email:em,password:pw});
  if(si.error){ msg.style.color='#e3342f'; msg.textContent='로그인 실패: '+si.error.message; return; }
  const {data:isA}=await sb.rpc('is_admin');
  if(!isA){ msg.style.color='#e3342f'; msg.textContent='관리자 권한이 없는 계정입니다.'; try{await sb.auth.signOut();}catch(e){} return; }
  unlockConsole();
});
document.getElementById('alPw').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('alBtn').click(); });
