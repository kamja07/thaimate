function applyLang(lang){
  var d=DICT[lang]||DICT.ko;
  document.querySelectorAll('[data-k]').forEach(function(el){ var k=el.getAttribute('data-k'); if(d[k]!=null) el.innerHTML=d[k]; });
  document.documentElement.lang=lang;
}
document.querySelectorAll('.lb').forEach(function(b){ b.addEventListener('click',function(){
  document.querySelectorAll('.lb').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); applyLang(b.getAttribute('data-lang'));
});});
applyLang('ko');

document.querySelectorAll('.qr').forEach(function(box){
  try{ new QRCode(box,{text:'https://thaimate.vercel.app',width:box.clientWidth-14,height:box.clientHeight-14,colorDark:'#241C14',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ box.innerHTML='<span style="font-size:11px;color:#FF6A1A">ThaiMate</span>'; }
});

document.querySelectorAll('.savebtn').forEach(function(btn){
  btn.addEventListener('click', async function(){
    var id=btn.getAttribute('data-save'), scale=parseFloat(btn.getAttribute('data-scale')), name=btn.getAttribute('data-name');
    var note=document.getElementById('note_'+id); note.textContent='🎨 이미지 만드는 중…';
    try{
      if(document.fonts&&document.fonts.ready) await document.fonts.ready;
      var el=document.getElementById(id);
      var canvas=await html2canvas(el,{scale:scale,backgroundColor:'#FFFBF3',useCORS:true,logging:false});
      var a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=name+'.png'; document.body.appendChild(a); a.click(); a.remove();
      note.textContent='✅ '+name+'.png 저장 완료 ('+canvas.width+'×'+canvas.height+')';
    }catch(err){ note.textContent='저장 실패: '+(err&&err.message||err); }
  });
});
